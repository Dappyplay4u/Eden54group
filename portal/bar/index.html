<style>
.cat-btns-wrap{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
@media(max-width:600px){.cat-btns-wrap{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}.cat-btns-wrap::-webkit-scrollbar{display:none}}
.cat-btn{padding:7px 14px;border:1px solid var(--border);border-radius:20px;background:none;color:var(--text);font-size:0.76rem;cursor:pointer;font-family:'Jost',sans-serif;transition:background .15s,border-color .15s,color .15s;white-space:nowrap;line-height:1.4;flex-shrink:0}
.cat-btn:hover{background:rgba(201,169,110,.12);border-color:var(--gold);color:var(--gold)}
.cat-btn.active{background:var(--gold);border-color:var(--gold);color:#0f2318;font-weight:500}
/* ── Lead modal ── */
.lead-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.lead-modal-box{background:#162d1f;border:1px solid rgba(201,169,110,0.2);border-radius:12px;padding:24px;width:100%;max-width:420px;max-height:80vh;display:flex;flex-direction:column;gap:0}
.lead-staff-row{padding:11px 12px;border-radius:6px;cursor:pointer;background:rgba(255,255,255,0.03);border:1px solid transparent;transition:all .15s;display:flex;flex-direction:column;gap:2px}
.lead-staff-row:hover{background:rgba(201,169,110,0.08);border-color:rgba(201,169,110,0.25)}
.lead-staff-row .sr-name{font-size:0.87rem;font-weight:400}
.lead-staff-row .sr-dept{font-size:0.7rem;color:var(--muted)}

<body>
<div class="sb-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<aside class="sidebar" id="sidebar">
  <div class="sb-brand"><div class="sb-brand-name">Eden 54</div><div class="sb-brand-sub">Staff Portal</div></div>
  <nav class="sb-nav" id="sbNav"></nav>
  <div class="sb-foot"><div id="sidebarUser"></div><a class="sb-item" onclick="switchProfile()" style="cursor:pointer"><i class="sb-icon">🔄</i> Switch Profile</a></div>
</aside>

<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <button class="hamburger" onclick="toggleSidebar()"><div></div><div></div><div></div></button>
      <h1>Bar Stock Report</h1>
    </div>
    <div class="topbar-date" id="topDate"></div>
  </div>
  <div class="content">
    <div id="alertBox" class="alert"></div>

    <!-- Daily bar lead assignment -->
    <div class="card" id="leadCard" style="margin-bottom:24px"></div>

    <!-- Live stock overview (populated from barStockLevels) -->
    <div class="card" id="stockOverviewCard" style="margin-bottom:24px;display:none">
      <div class="section-head" style="flex-wrap:wrap;gap:8px">
        <h2>Current Stock Levels</h2>
        <span id="stockLastUpdated" style="font-size:0.75rem;color:var(--muted)"></span>
      </div>
      <div id="stockLowAlert" style="display:none;margin-bottom:14px;padding:10px 14px;background:rgba(220,38,38,.07);border-radius:6px;border:1px solid rgba(220,38,38,.2)">
        <div style="font-size:0.68rem;font-weight:500;color:#dc2626;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px">Low Stock Alerts</div>
        <div id="stockLowList" style="font-size:0.8rem;line-height:1.7"></div>
      </div>
      <div id="stockOverviewGrid"></div>
    </div>

    <div class="card">
      <div class="section-head" style="flex-wrap:wrap;gap:10px">
        <h2>Daily Bar Stock Count</h2>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <input type="date" id="barDate" class="form-control" style="min-width:140px;flex:1">
          <button class="btn btn-gold" id="submitBtn" onclick="submitBar()">Save Report</button>
        </div>
      </div>

      <div class="cat-btns-wrap" id="catBtns"></div>
      <div class="tbl-wrap stock-table">
        <table style="min-width:760px">
          <thead><tr><th>Item</th><th>Category</th><th>Opening Stock</th><th>Received</th><th>Closing Stock</th><th>Sold (auto)</th><th>Low Alert</th></tr></thead>
          <tbody id="barItems"></tbody>
        </table>
      </div>

      <div class="divider"></div>
      <div class="form-group">
        <label class="form-label">Notes</label>
        <textarea id="barNotes" class="form-control" rows="2" placeholder="Any stock issues, damage, shortage…"></textarea>
      </div>
    </div>

    <div class="card mt24">
      <div class="section-head"><h2>Recent Reports</h2></div>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>Date</th><th>Items</th><th>Low Stock</th><th>Filed By</th></tr></thead>
          <tbody id="histTable"><tr><td colspan="4" style="text-align:center;padding:16px;color:#6a6b62">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>

    <!-- Sales vs Stock Reconciliation — CEO/Manager only, built by JS -->
    <div class="card mt24" id="reportsCard" style="display:none"></div>
  </div>
</div>

/* ════ Role flags ════ */
const _role     = (staff.accessLevel || staff.role || '').toLowerCase().replace(/\s+/g,'');
const isCEO     = _role === 'ceo' || _role === 'superadmin';
const isManager = isCEO || _role === 'manager' || _role.includes('manager') || _role.includes('admin');
const isHR      = _role.includes('hr') || _role.includes('human');

/* ════ Daily Bar Lead ════ */
let dailyLead      = null;
let canSubmit      = false;
let isAssignedLead = false;
let pinUnlocked    = false;
let todaySubmitted = false;
let _pinAttempts   = 0;
let _allStaff      = [];

async function loadDailyLead() {
  try {
    const [leadDoc, submittedSnap] = await Promise.all([
      db.collection('barConfig').doc('dailyLead').get(),
      db.collection('bar_stock').where('date','==',todayStr()).limit(1).get(),
    ]);
    if (leadDoc.exists) {
      const d = leadDoc.data();
      if (d.date === todayStr()) { dailyLead = d; isAssignedLead = d.staffId === staff.id; }
    }
    todaySubmitted = !submittedSnap.empty;
  } catch(e) {}
  // Lead can only edit/submit once — after submission only PIN unlocks it
  canSubmit = (!todaySubmitted && isAssignedLead) || (isManager && pinUnlocked);
  renderLeadCard();
  updateSubmitBtn();
}

/* ════ PIN System ════ */
async function _sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function _loadPinHash() {
  try { const d = await db.collection('barConfig').doc('pinHash').get(); return d.exists ? d.data().hash : null; }
  catch(e) { return null; }
}

async function openPinModal() {
  if (_pinAttempts >= 3) {
    showAlert('alertBox','Too many incorrect attempts. Refresh the page to try again.','alert-error'); return;
  }
  const storedHash = await _loadPinHash();
  if (!storedHash) {
    if (isCEO) { _openSetPinModal('No PIN set yet. Set one to protect bar stock editing.'); return; }
    showAlert('alertBox','No bar stock PIN has been set. Ask the CEO to set one first.','alert-error'); return;
  }
  document.getElementById('pinModal')?.remove();
  const ov = document.createElement('div');
  ov.className = 'lead-modal-overlay'; ov.id = 'pinModal';
  ov.innerHTML = `
    <div class="lead-modal-box" style="max-width:320px">
      <div style="text-align:center;margin-bottom:18px">
        <div style="font-size:2.2rem;margin-bottom:6px">🔐</div>
        <h3 style="font-size:0.98rem;font-weight:500;margin-bottom:4px">Unlock Bar Stock</h3>
        <p style="font-size:0.75rem;color:var(--muted)">Enter the CEO PIN to unlock editing for this session</p>
      </div>
      <input id="pinInput" type="password" inputmode="numeric" maxlength="6" placeholder="• • • • • •"
        style="width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(201,169,110,0.22);border-radius:6px;padding:14px;color:var(--text);font-family:'Jost',sans-serif;font-size:1.4rem;text-align:center;letter-spacing:0.4em;outline:none;margin-bottom:6px;box-sizing:border-box"
        oninput="if(this.value.length===6)_submitPin(this.value)">
      <div id="pinErr" style="font-size:0.74rem;color:#fca5a5;text-align:center;min-height:18px;margin-bottom:12px"></div>
      <div style="display:flex;gap:8px">
        <button onclick="document.getElementById('pinModal').remove()" style="flex:1;padding:10px;background:none;border:1px solid var(--border);border-radius:6px;color:var(--muted);font-family:'Jost',sans-serif;font-size:0.82rem;cursor:pointer">Cancel</button>
        <button onclick="_submitPin(document.getElementById('pinInput').value)" style="flex:1;padding:10px;background:var(--gold);border:none;border-radius:6px;color:#0f2318;font-family:'Jost',sans-serif;font-size:0.82rem;font-weight:500;cursor:pointer">Unlock</button>
      </div>
      ${isCEO ? `<div style="text-align:center;margin-top:12px">
        <button onclick="document.getElementById('pinModal').remove();_openSetPinModal('Change PIN')" style="background:none;border:none;color:var(--muted);font-size:0.7rem;cursor:pointer;text-decoration:underline;font-family:'Jost',sans-serif">Change PIN</button>
      </div>` : ''}
    </div>`;
  document.body.appendChild(ov);
  setTimeout(() => document.getElementById('pinInput')?.focus(), 60);
}

async function _submitPin(pin) {
  if (!pin) { const e=document.getElementById('pinErr'); if(e) e.textContent='Enter your PIN.'; return; }
  const hash = await _sha256(pin.trim());
  const stored = await _loadPinHash();
  if (hash === stored) {
    document.getElementById('pinModal')?.remove();
    _pinAttempts = 0; pinUnlocked = true;
    canSubmit = true;
    renderLeadCard(); updateSubmitBtn(); _unlockForm();
    showAlert('alertBox','🔓 Bar stock unlocked. You can now edit and submit the count.','alert-success');
  } else {
    _pinAttempts++;
    const left = 3 - _pinAttempts;
    const e = document.getElementById('pinErr');
    if (e) e.textContent = left > 0 ? `Incorrect PIN — ${left} attempt${left!==1?'s':''} remaining.` : 'Too many attempts. Refresh to try again.';
    const inp = document.getElementById('pinInput');
    if (inp) { inp.value = ''; if (left > 0) inp.focus(); }
    if (_pinAttempts >= 3) setTimeout(() => document.getElementById('pinModal')?.remove(), 1800);
  }
}

function _openSetPinModal(subtitle) {
  if (!isCEO) return;
  document.getElementById('setPinModal')?.remove();
  const ov = document.createElement('div');
  ov.className = 'lead-modal-overlay'; ov.id = 'setPinModal';
  ov.innerHTML = `
    <div class="lead-modal-box" style="max-width:320px">
      <div style="text-align:center;margin-bottom:18px">
        <div style="font-size:2.2rem;margin-bottom:6px">🔒</div>
        <h3 style="font-size:0.98rem;font-weight:500;margin-bottom:4px">Set Bar Stock PIN</h3>
        <p style="font-size:0.75rem;color:var(--muted)">${esc(subtitle || 'Set a CEO PIN to protect bar stock editing')}</p>
      </div>
      <input id="newPin1" type="password" inputmode="numeric" maxlength="6" placeholder="New PIN (4–6 digits)"
        style="width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(201,169,110,0.22);border-radius:6px;padding:12px;color:var(--text);font-family:'Jost',sans-serif;font-size:1.2rem;text-align:center;letter-spacing:0.3em;outline:none;margin-bottom:10px;box-sizing:border-box">
      <input id="newPin2" type="password" inputmode="numeric" maxlength="6" placeholder="Confirm PIN"
        style="width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(201,169,110,0.22);border-radius:6px;padding:12px;color:var(--text);font-family:'Jost',sans-serif;font-size:1.2rem;text-align:center;letter-spacing:0.3em;outline:none;margin-bottom:6px;box-sizing:border-box">
      <div id="setPinErr" style="font-size:0.74rem;color:#fca5a5;text-align:center;min-height:18px;margin-bottom:12px"></div>
      <div style="display:flex;gap:8px">
        <button onclick="document.getElementById('setPinModal').remove()" style="flex:1;padding:10px;background:none;border:1px solid var(--border);border-radius:6px;color:var(--muted);font-family:'Jost',sans-serif;font-size:0.82rem;cursor:pointer">Cancel</button>
        <button onclick="_confirmSetPin()" style="flex:1;padding:10px;background:var(--gold);border:none;border-radius:6px;color:#0f2318;font-family:'Jost',sans-serif;font-size:0.82rem;font-weight:500;cursor:pointer">Save PIN</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  setTimeout(() => document.getElementById('newPin1')?.focus(), 60);
}

async function _confirmSetPin() {
  const p1 = (document.getElementById('newPin1').value || '').trim();
  const p2 = (document.getElementById('newPin2').value || '').trim();
  const err = document.getElementById('setPinErr');
  if (!p1 || p1.length < 4) { err.textContent = 'PIN must be 4–6 digits.'; return; }
  if (!/^\d+$/.test(p1))    { err.textContent = 'PIN must be numbers only.'; return; }
  if (p1 !== p2)             { err.textContent = 'PINs do not match.'; return; }
  try {
    await db.collection('barConfig').doc('pinHash').set({
      hash: await _sha256(p1),
      setBy: staff.id, setAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    document.getElementById('setPinModal')?.remove();
    showAlert('alertBox','✅ Bar stock PIN saved. It will be required to unlock editing.','alert-success');
  } catch(e) { err.textContent = 'Error: ' + e.message; }
}

function _unlockForm() {
  document.querySelectorAll('#barItems input').forEach(el => {
    el.disabled = false; el.style.opacity = ''; el.style.cursor = ''; el.style.pointerEvents = '';
  });
  ['barNotes','barDate'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.disabled = false; el.style.opacity = ''; }
  });
  // Restore submit button if it was replaced with the unlock button
  const placeholder = document.getElementById('submitPlaceholder');
  if (placeholder) {

}

async function assignLead(staffId, staffName) {
  document.getElementById('leadModal')?.remove();
  try {
    await db.collection('barConfig').doc('dailyLead').set({
      staffId, staffName,
      date: todayStr(),
      designatedBy: { id: staff.id, name: staff.name },
      designatedAt: firebase.firestore.FieldValue.serverTimestamp(),

function itemSlug(name) {
  return name.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
}

async function loadStockLevels() {
  try {
    const snap = await db.collection('barStockLevels').get();
    const map = {};
    snap.forEach(d => { map[d.id] = d.data(); });
    return map;
  } catch(e) { return {}; }
}

function renderStockOverview(levels) {
  const card = document.getElementById('stockOverviewCard');
  if (!levels || !Object.keys(levels).length) { card.style.display = 'none'; return; }
  card.style.display = '';

  let latestDate = null;
  Object.values(levels).forEach(l => {
    const d = l.lastUpdatedAt?.toDate?.();
    if (d && (!latestDate || d > latestDate)) latestDate = d;
  });
  document.getElementById('stockLastUpdated').textContent = latestDate
    ? 'Updated ' + latestDate.toLocaleDateString('en-NG',{day:'2-digit',month:'short',year:'numeric'}) + ' ' + latestDate.toLocaleTimeString('en-NG',{hour:'2-digit',minute:'2-digit'})
    : '';

  let html = '';
  let lastCat = null;
  const lowItems = [];

  BAR_ITEMS.forEach(item => {
    const lvl = levels[itemSlug(item.name)];
    const qty = lvl ? (lvl.qty || 0) : 0;
    const isLow = qty <= item.low;
    if (isLow) lowItems.push({ name: item.name, qty, low: item.low, crate: item.crate, qtyCrates: lvl?.qtyCrates, qtyUnits: lvl?.qtyUnits });

    if (item.cat !== lastCat) {
      if (lastCat !== null) html += '</div></div>';
      html += `<div style="margin-bottom:10px"><div style="font-size:0.62rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);padding:7px 0 5px;border-bottom:1px solid var(--border);margin-bottom:6px">${item.cat}</div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:5px">`;
      lastCat = item.cat;
    }
    const dotColor  = qty === 0 ? '#dc2626' : isLow ? '#d97706' : '#16a34a';
    const qtyColor  = qty === 0 ? '#dc2626' : isLow ? '#d97706' : 'var(--text)';
    const rowBorder = isLow ? 'rgba(220,38,38,.25)' : 'var(--border)';
    const rowBg     = qty === 0 ? 'rgba(220,38,38,.04)' : isLow ? 'rgba(217,119,6,.04)' : 'transparent';
    // Beer: show "Xcr + Yu" breakdown
    let qtyStr;
    if (item.crate && lvl && (lvl.qtyCrates !== undefined || lvl.qtyUnits !== undefined)) {
      const cr = lvl.qtyCrates || 0;
      const un = lvl.qtyUnits  || 0;
      qtyStr = cr > 0 && un > 0 ? `${cr}cr+${un}u` : cr > 0 ? `${cr} crates` : `${un} units`;
    } else {
      qtyStr = String(qty);
    }
    html += `<div style="display:flex;align-items:center;gap:6px;padding:5px 8px;border:1px solid ${rowBorder};border-radius:5px;background:${rowBg}">
      <span style="width:6px;height:6px;border-radius:50%;background:${dotColor};flex-shrink:0"></span>
      <span style="font-size:0.74rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${item.name}</span>
      <span style="font-size:0.8rem;font-weight:500;color:${qtyColor};flex-shrink:0;white-space:nowrap">${qtyStr}</span>
    </div>`;
  });
  if (lastCat !== null) html += '</div></div>';

  document.getElementById('stockOverviewGrid').innerHTML = html;

  const lowAlert = document.getElementById('stockLowAlert');
  const lowList  = document.getElementById('stockLowList');
  if (lowItems.length) {
    lowAlert.style.display = '';
    lowList.innerHTML = lowItems.map(x => {
      let qtyLabel;
      if (x.crate && x.qtyCrates !== undefined) {
        const cr = x.qtyCrates || 0; const un = x.qtyUnits || 0;
        qtyLabel = cr > 0 && un > 0 ? `${cr}cr + ${un}u` : cr > 0 ? `${cr} crates` : `${un} units`;
      } else { qtyLabel = String(x.qty); }
      return `<span style="display:inline-block;margin:1px 4px 1px 0;padding:2px 8px;background:rgba(220,38,38,.1);border-radius:4px;font-size:0.75rem">${x.name}: <strong>${qtyLabel}</strong>${x.qty === 0 ? ' — OUT' : ''}</span>`;
    }).join('');
  } else {
    lowAlert.style.display = 'none';
  }
}

function crateCell(prefix, i, crates, units) {
  return `<div style="display:flex;align-items:center;gap:3px;white-space:nowrap">
    <input type="number" min="0" id="${prefix}_c_${i}" value="${crates}" placeholder="0" style="width:40px;text-align:center;padding:4px 2px" oninput="calcRow(${i})">
    <span style="font-size:0.6rem;color:var(--muted)">cr</span>
    <input type="number" min="0" id="${prefix}_u_${i}" value="${units}" placeholder="0" style="width:36px;text-align:center;padding:4px 2px" oninput="calcRow(${i})">
    <span style="font-size:0.6rem;color:var(--muted)">u</span>
  </div>`;
}

let _activeCat = '';

function buildCatButtons() {
  const container = document.getElementById('catBtns');
  container.innerHTML = '';
  const cats = [...new Set(BAR_ITEMS.map(x => x.cat))];
  const counts = {};
  BAR_ITEMS.forEach(x => { counts[x.cat] = (counts[x.cat] || 0) + 1; });

  const makeBtn = (label, cat) => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (cat === _activeCat ? ' active' : '');
    btn.dataset.cat = cat;
    btn.textContent = label;
    btn.onclick = () => filterCategory(cat);
    return btn;
  };
  container.appendChild(makeBtn('All', ''));
  cats.forEach(cat => container.appendChild(makeBtn(`${cat} (${counts[cat]})`, cat)));
}

function filterCategory(cat) {
  _activeCat = cat;
  document.querySelectorAll('#barItems tr[data-cat]').forEach(tr => {
    tr.style.display = (!cat || tr.dataset.cat === cat) ? '' : 'none';
  });
  document.querySelectorAll('#catBtns .cat-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.cat === cat);

      lastCat = item.cat;
    }
    if (item.crate) {
      const openCr = lvl ? (lvl.qtyCrates || 0) : 0;
      const openUn = lvl ? (lvl.qtyUnits  || 0) : 0;
      const openDisplay = openCr > 0 && openUn > 0 ? `${openCr}cr + ${openUn}u`
        : openCr > 0 ? `${openCr} crates` : `${openUn} units`;
      html += `<tr data-cat="${item.cat}" data-open-cr="${openCr}" data-open-un="${openUn}">
        <td class="fw4" style="padding-left:18px">${item.name}</td>
        <td><span class="badge badge-info" style="font-size:0.58rem">${item.cat}</span></td>
        <td><span style="font-size:0.82rem;font-weight:500;color:var(--text);padding:4px 6px">${openDisplay}</span></td>
        <td>${crateCell('recv',  i, 0, 0)}</td>
        <td class="closing">${crateCell('close', i, 0, 0)}</td>
        <td id="sold_${i}" style="text-align:center;font-weight:400">0</td>
        <td id="low_${i}"></td>
      </tr>`;
    } else {
      const openQty = lvl ? (lvl.qty || 0) : 0;
      html += `<tr data-cat="${item.cat}" data-open="${openQty}">
        <td class="fw4" style="padding-left:18px">${item.name}</td>
        <td><span class="badge badge-info" style="font-size:0.58rem">${item.cat}</span></td>
        <td><span style="font-size:0.82rem;font-weight:500;color:var(--text);padding:4px 6px">${openQty}</span></td>
        <td><input type="number" min="0" id="recv_${i}" placeholder="0" value="0" oninput="calcRow(${i})"></td>
        <td class="closing"><input type="number" min="0" id="close_${i}" placeholder="0" value="0" oninput="calcRow(${i})"></td>
        <td id="sold_${i}" style="text-align:center;font-weight:400">0</td>
        <td id="low_${i}"></td>
      </tr>`;
    }
  });
  tbody.innerHTML = html;
  BAR_ITEMS.forEach((_, i) => calcRow(i));

/* ── Lock all form inputs ── */
function applyFormLock() {
  if (canSubmit) return;
  const s = 'opacity:0.45;cursor:not-allowed;pointer-events:none';
  document.querySelectorAll('#barItems input').forEach(el => { el.disabled = true; el.style.cssText += ';' + s; });
  ['barNotes','barDate'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.disabled = true; el.style.cssText += ';' + s; }
  });
  const btn = document.getElementById('submitBtn');
  if (!btn) return;
  if (isManager) {
    // Manager/CEO: replace submit with PIN unlock button
    btn.outerHTML = `<button id="submitPlaceholder" onclick="openPinModal()"
      style="padding:8px 16px;background:rgba(201,169,110,0.12);border:1px solid rgba(201,169,110,0.35);color:var(--gold);border-radius:5px;cursor:pointer;font-family:'Jost',sans-serif;font-size:0.76rem;letter-spacing:0.06em;white-space:nowrap">
      🔐 Unlock with CEO PIN</button>`;
  } else if (todaySubmitted && isAssignedLead) {
    // Lead already submitted today
    btn.outerHTML = `<div style="font-size:0.75rem;color:#16a34a;align-self:center">✅ Report submitted for today</div>`;
  } else {
    // Other staff — read-only view
    btn.outerHTML = `<div style="font-size:0.75rem;color:var(--muted);font-style:italic;align-self:center">
      👁 ${dailyLead ? dailyLead.staffName + ' is today\'s lead' : 'No lead assigned'}</div>`;
  }
}

/* ── Auto-fill Received column from today's marked-received procurements ── */
async function loadTodayReceived() {
  if (!canSubmit) return;
  try {
    const todayStart = new Date(); todayStart.setHours(0,0,0,0);
    const snap = await db.collection('procurements')
      .where('status','==','received')
      .where('receivedAt','>=', todayStart)
      .get();
    if (snap.empty) return;
    const recvMap = {};
    snap.docs.forEach(d => {
      (d.data().items || []).forEach(item => {
        if (!item.name) return;
        const slug = itemSlug(item.name);
        recvMap[slug] = (recvMap[slug] || 0) + (item.qty || 0);
      });
    });
    let filled = 0;
    BAR_ITEMS.forEach((item, i) => {
      const qty = recvMap[itemSlug(item.name)] || 0;
      if (!qty) return;
      if (item.crate) {
        const cr = Math.floor(qty / item.crate), un = qty % item.crate;
        const cEl = document.getElementById(`recv_c_${i}`);
        const uEl = document.getElementById(`recv_u_${i}`);
        if (cEl) cEl.value = cr;
        if (uEl) uEl.value = un;
      } else {
        const el = document.getElementById(`recv_${i}`);
        if (el) el.value = qty;
      }
      calcRow(i); filled++;
    });
    if (filled) showAlert('alertBox', `📦 ${filled} item(s) received today auto-filled from procurement records. Verify and adjust if needed.`, 'alert-success');
  } catch(e) { /* silent — lead can fill manually */ }
}

async function init() {
  await loadDailyLead();
  const levels = await loadStockLevels();
  renderStockOverview(levels);
  buildTable(levels);
  applyFormLock();
  if (canSubmit) loadTodayReceived();
  loadHistory();
  if (isManager || isHR) initReportsCard();
}
init();

function _getOpenQty(item, i) {
  const anyEl = document.getElementById(item.crate ? `recv_c_${i}` : `recv_${i}`);
  const tr = anyEl?.closest('tr');
  if (!tr) return 0;
  if (item.crate) {
    return (+(tr.dataset.openCr || 0)) * item.crate + (+(tr.dataset.openUn || 0));
  }
  return +(tr.dataset.open || 0);
}

function calcRow(i) {
  const item = BAR_ITEMS[i];
  let open, recv, close;
  if (item.crate) {
    const rc = +document.getElementById(`recv_c_${i}`)?.value  || 0;
    const ru = +document.getElementById(`recv_u_${i}`)?.value  || 0;
    const cc = +document.getElementById(`close_c_${i}`)?.value || 0;
    const cu = +document.getElementById(`close_u_${i}`)?.value || 0;
    open  = _getOpenQty(item, i);
    recv  = rc * item.crate + ru;
    close = cc * item.crate + cu;
  } else {
    open  = _getOpenQty(item, i);
    recv  = +document.getElementById(`recv_${i}`)?.value  || 0;
    close = +document.getElementById(`close_${i}`)?.value || 0;
  }
  const sold = Math.max(0, open + recv - close);
  document.getElementById(`sold_${i}`).textContent = sold + (item.crate ? ' u' : '');
  document.getElementById(`low_${i}`).innerHTML = close <= item.low
    ? `<span class="badge badge-warn">Low</span>`
    : `<span class="badge badge-ok">OK</span>`;
}

async function submitBar() {
  if (!canSubmit) {
    showAlert('alertBox', dailyLead
      ? `Only ${dailyLead.staffName} or a manager can submit today's count.`
      : 'A manager must assign a bar lead before the stock count can be submitted.', 'alert-error');
    return;
  }
  const date  = document.getElementById('barDate').value;
  const notes = document.getElementById('barNotes').value.trim();
  const user  = staff;
  const items = BAR_ITEMS.map((item, i) => {
    if (item.crate) {
      // Opening is locked — read from row data attribute (set from Firestore on load)
      const anyEl = document.getElementById(`recv_c_${i}`);
      const tr = anyEl?.closest('tr');
      const oc = tr ? +(tr.dataset.openCr || 0) : 0;
      const ou = tr ? +(tr.dataset.openUn || 0) : 0;
      const rc = +document.getElementById(`recv_c_${i}`)?.value  || 0;
      const ru = +document.getElementById(`recv_u_${i}`)?.value  || 0;
      const cc = +document.getElementById(`close_c_${i}`)?.value || 0;
      const cu = +document.getElementById(`close_u_${i}`)?.value || 0;
      const tot = (n, u) => n * item.crate + u;
      return {
        name: item.name, category: item.cat, crateSize: item.crate,
        openingCrates: oc, openingUnits: ou, opening: tot(oc, ou),
        receivedCrates: rc, receivedUnits: ru, received: tot(rc, ru),
        closingCrates: cc, closingUnits: cu, closing: tot(cc, cu),
        sold: Math.max(0, tot(oc,ou) + tot(rc,ru) - tot(cc,cu)),
        lowAlert: tot(cc, cu) <= item.low,
      };
    }
    // Opening is locked — read from row data attribute
    const anyEl  = document.getElementById(`recv_${i}`);
    const tr     = anyEl?.closest('tr');
    const opening  = tr ? +(tr.dataset.open || 0) : 0;
    const received = +document.getElementById(`recv_${i}`)?.value  || 0;
    const closing  = +document.getElementById(`close_${i}`)?.value || 0;
    return {
      name: item.name, category: item.cat,
      opening, received, closing,
      sold: Math.max(0, opening + received - closing),
      lowAlert: closing <= item.low,
    };
  });
  const lowItems = items.filter(x => x.lowAlert).map(x => x.name);
  const btn = document.getElementById('submitBtn');
  const existSnap = await db.collection('bar_stock')
    .where('date', '==', date)
    .where('staffId', '==', staff.id)
    .limit(1).get();
  if (!existSnap.empty) {
    if (!confirm('You already submitted a bar report today. Submit another one?')) return;
  }
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    // Single atomic batch: bar_stock report + barStockLevels update together.
    // If either write fails, neither is committed — stock levels stay consistent.
    const batch    = db.batch();
    const stockRef = db.collection('bar_stock').doc(); // pre-generate ID
    batch.set(stockRef, {
      date, items, notes, lowItems, staffId: user.id, staffName: user.name,
      submittedAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    BAR_ITEMS.forEach((item, i) => {
      let closeTotal, data;
      if (item.crate) {
        const cc = +document.getElementById(`close_c_${i}`)?.value || 0;
        const cu = +document.getElementById(`close_u_${i}`)?.value || 0;
        closeTotal = cc * item.crate + cu;
        data = { name: item.name, cat: item.cat, qty: closeTotal,
          qtyCrates: cc, qtyUnits: cu, crateSize: item.crate,
          lastCountedAt: firebase.firestore.FieldValue.serverTimestamp(),
          lastUpdatedAt: firebase.firestore.FieldValue.serverTimestamp() };
      } else {
        closeTotal = +document.getElementById(`close_${i}`)?.value || 0;
        data = { name: item.name, cat: item.cat, qty: closeTotal,
          lastCountedAt: firebase.firestore.FieldValue.serverTimestamp(),
          lastUpdatedAt: firebase.firestore.FieldValue.serverTimestamp() };
      }
      batch.set(db.collection('barStockLevels').doc(itemSlug(item.name)), data, { merge: true });
    });
    await batch.commit();

    // Lock the lead out — report submitted, only PIN can re-open
    todaySubmitted = true;
    if (!pinUnlocked) canSubmit = false;
    showAlert('alertBox','Bar stock report saved and stock levels updated!','alert-success');
    document.getElementById('barNotes').value = '';
    const levels = await loadStockLevels();
    renderStockOverview(levels);
    buildTable(levels);
    renderLeadCard();
    applyFormLock();
    loadHistory();
  } catch(e) {
    showAlert('alertBox','Error saving report: ' + e.message,'alert-error');
    btn.disabled = false; btn.textContent = 'Save Report';
  }
}

/* ════ Sales vs Stock Reconciliation (CEO / Manager) ════ */
const BAR_ITEM_NAMES = new Set(BAR_ITEMS.map(x => x.name));
let _reportPeriod = 'today';

function initReportsCard() {
  const card = document.getElementById('reportsCard');
  if (!card) return;
  card.style.display = '';
  card.innerHTML = `
    <div class="section-head" style="flex-wrap:wrap;gap:8px">
      <h2>Sales vs Stock Reconciliation</h2>
      <span style="font-size:0.72rem;color:var(--muted)">Compare what the stock count says was consumed against what POS recorded</span>
    </div>
    <div class="cat-btns-wrap" style="margin-top:12px">
      <button class="cat-btn active" data-rp="today"  onclick="setReportPeriod('today')">Today</button>
      <button class="cat-btn"        data-rp="week"   onclick="setReportPeriod('week')">This Week</button>
      <button class="cat-btn"        data-rp="month"  onclick="setReportPeriod('month')">This Month</button>
      <button class="cat-btn"        data-rp="year"   onclick="setReportPeriod('year')">This Year</button>
      <button class="cat-btn"        data-rp="custom" onclick="setReportPeriod('custom')">Custom Range</button>
    </div>
    <div id="repCustomWrap" style="display:none;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;margin-top:4px">
      <input type="date" id="repStart" class="form-control" style="min-width:140px">
      <span style="color:var(--muted);font-size:0.8rem">to</span>
      <input type="date" id="repEnd"   class="form-control" style="min-width:140px">
      <button onclick="runCustomReport()" style="padding:8px 18px;background:var(--gold);border:none;border-radius:5px;color:#0f2318;font-family:'Jost',sans-serif;font-size:0.8rem;font-weight:500;cursor:pointer">Run</button>
    </div>
    <div id="repSummary" style="display:none;flex-wrap:wrap;gap:8px;margin-bottom:14px"></div>
    <div class="tbl-wrap">
      <table id="repTable" style="min-width:680px">
        <thead><tr>
          <th>Item</th><th>Category</th>
          <th style="text-align:center" title="Opening + Received − Closing from stock count">Stock Consumed</th>
          <th style="text-align:center" title="Units recorded through POS / Tabs">POS Qty</th>
          <th style="text-align:center" title="Stock Consumed − POS Qty. Positive = unaccounted loss">Variance</th>
          <th style="text-align:right">POS Revenue</th>
        </tr></thead>
        <tbody id="repTbody"><tr><td colspan="6" style="text-align:center;padding:24px;color:var(--muted)">Select a period above to load the report.</td></tr></tbody>
      </table>
    </div>`;
  setReportPeriod('today');
}

function setReportPeriod(period) {
  _reportPeriod = period;
  document.querySelectorAll('#reportsCard .cat-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.rp === period));
  const cw = document.getElementById('repCustomWrap');
  if (cw) cw.style.display = period === 'custom' ? 'flex' : 'none';
  if (period !== 'custom') fetchBarReport(period, null, null);
}

function runCustomReport() {
  const s = document.getElementById('repStart')?.value;
  const e = document.getElementById('repEnd')?.value;
  if (!s || !e) { showAlert('alertBox','Select both a start and end date.','alert-error'); return; }
  if (s > e)    { showAlert('alertBox','Start date must be on or before the end date.','alert-error'); return; }
  fetchBarReport('custom', s, e);
}

function _repDateRange(period, cs, ce) {
  if (period === 'custom') return { start: cs, end: ce };
  const t = new Date();
  const pad = n => String(n).padStart(2,'0');
  const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  if (period === 'today')  { const s = fmt(t); return { start: s, end: s }; }
  if (period === 'week')   {
    const mon = new Date(t); mon.setDate(t.getDate() - ((t.getDay()+6)%7));
    const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
    return { start: fmt(mon), end: fmt(sun) };
  }
  if (period === 'month')  {
    return { start: fmt(new Date(t.getFullYear(),t.getMonth(),1)), end: fmt(new Date(t.getFullYear(),t.getMonth()+1,0)) };
  }
  if (period === 'year')   { return { start: `${t.getFullYear()}-01-01`, end: `${t.getFullYear()}-12-31` }; }
  return null;
}

async function fetchBarReport(period, cs, ce) {
  const tbody   = document.getElementById('repTbody');
  const summary = document.getElementById('repSummary');
  if (!tbody) return;
  tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:24px;color:var(--muted)">Loading…</td></tr>`;
  if (summary) summary.style.display = 'none';

  const rng = _repDateRange(period, cs, ce);
  if (!rng) return;

  try {
    const [stockSnap, salesSnap] = await Promise.all([
      db.collection('bar_stock').where('date','>=',rng.start).where('date','<=',rng.end).get(),
      db.collection('sales').where('date','>=',rng.start).where('date','<=',rng.end).get(),
    ]);

    // Aggregate stock consumed per item name (from daily bar_stock submissions)
    const stockConsumed = {};
    stockSnap.docs.forEach(d => {
      (d.data().items||[]).forEach(item => {
        if (item.name) stockConsumed[item.name] = (stockConsumed[item.name]||0) + (item.sold||0);
      });
    });

    // Aggregate POS qty + revenue per bar item name
    const posData = {};
    salesSnap.docs.forEach(d => {
      (d.data().items||[]).forEach(item => {
        if (!item.name || !BAR_ITEM_NAMES.has(item.name)) return;
        if (!posData[item.name]) posData[item.name] = { qty:0, revenue:0 };
        posData[item.name].qty     += (item.qty || 0);
        posData[item.name].revenue += (item.total || 0);
      });
    });

    // Build table rows in BAR_ITEMS order
    let rows = '';
    let lastCat = null;
    let totSC=0, totPOS=0, totRev=0, totVar=0, activeRows=0;

    BAR_ITEMS.forEach(item => {
      const sc  = stockConsumed[item.name] || 0;
      const pq  = posData[item.name]?.qty  || 0;
      const rev = posData[item.name]?.revenue || 0;
      if (sc === 0 && pq === 0) return;

      activeRows++;
      const variance = sc - pq;
      totSC  += sc; totPOS += pq; totRev += rev; totVar += variance;

      let vColor, vBg;
      if (variance === 0)  { vColor='#16a34a'; vBg='rgba(22,163,74,0.09)'; }
      else if (variance>0) { vColor='#dc2626'; vBg='rgba(220,38,38,0.08)'; }
      else                 { vColor='#d97706'; vBg='rgba(217,119,6,0.08)'; }

      if (item.cat !== lastCat) {
        rows += `<tr style="background:rgba(255,255,255,0.025)"><td colspan="6" style="padding:7px 12px 4px;font-size:0.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:400">${item.cat}</td></tr>`;
        lastCat = item.cat;
      }
      rows += `<tr>
        <td class="fw4" style="padding-left:18px">${esc(item.name)}</td>
        <td><span class="badge badge-info" style="font-size:0.58rem">${item.cat}</span></td>
        <td style="text-align:center">${sc}</td>
        <td style="text-align:center">${pq}</td>
        <td style="text-align:center"><span style="display:inline-block;padding:2px 9px;border-radius:10px;font-size:0.72rem;font-weight:500;color:${vColor};background:${vBg}">${variance>0?'+':''}${variance}</span></td>
        <td style="text-align:right;font-variant-numeric:tabular-nums">₦${rev.toLocaleString('en-NG')}</td>
      </tr>`;
    });

    if (!activeRows) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:28px;color:var(--muted)">No data found for this period. Bar stock reports and POS sales will appear here once recorded.</td></tr>`;
      return;
    }

    const tvColor = totVar===0?'#16a34a':totVar>0?'#dc2626':'#d97706';
    rows += `<tr style="border-top:2px solid var(--border);font-weight:500">
      <td colspan="2" style="padding:10px 12px">TOTAL (${activeRows} items)</td>
      <td style="text-align:center">${totSC}</td>
      <td style="text-align:center">${totPOS}</td>
      <td style="text-align:center;color:${tvColor};font-weight:600">${totVar>0?'+':''}${totVar}</td>
      <td style="text-align:right;font-variant-numeric:tabular-nums">₦${totRev.toLocaleString('en-NG')}</td>
    </tr>`;
    tbody.innerHTML = rows;

    // Summary pills
    if (summary) {
      const pill = (icon, label, bg, color, border) =>
        `<span style="display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:20px;font-size:0.75rem;background:${bg};color:${color};border:1px solid ${border||color}">${icon} ${label}</span>`;
      const varLabel = totVar===0 ? 'No variance' : totVar>0 ? `+${totVar} unaccounted` : `${Math.abs(totVar)} over-POS`;
      const varBg    = totVar===0 ? 'rgba(22,163,74,0.09)' : totVar>0 ? 'rgba(220,38,38,0.08)' : 'rgba(217,119,6,0.08)';
      const varBorder= totVar===0 ? 'rgba(22,163,74,0.35)' : totVar>0 ? 'rgba(220,38,38,0.3)' : 'rgba(217,119,6,0.3)';
      summary.innerHTML =
        pill('📋', `${stockSnap.size} stock report${stockSnap.size!==1?'s':''}`, 'rgba(201,169,110,0.1)', '#C9A96E', 'rgba(201,169,110,0.35)') +
        pill('🧾', `${salesSnap.size} sale${salesSnap.size!==1?'s':''}`, 'rgba(201,169,110,0.1)', '#C9A96E', 'rgba(201,169,110,0.35)') +
        pill('💰', `₦${totRev.toLocaleString('en-NG')} revenue`, 'rgba(22,163,74,0.09)', '#16a34a', 'rgba(22,163,74,0.35)') +
        pill(totVar===0?'✓':totVar>0?'⚠':'ℹ', varLabel, varBg, tvColor, varBorder);
      summary.style.display = 'flex';
    }
  } catch(e) {
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:20px;color:#ef4444">Error: ${esc(e.message)}</td></tr>`;
  }
}

async function loadHistory() {
  const tbody = document.getElementById('histTable');
  try {
    const snap = await db.collection('bar_stock').orderBy('submittedAt','desc').limit(14).get();
    if (snap.empty) { tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:16px;color:#6a6b62">No reports yet.</td></tr>'; return; }
    tbody.innerHTML = snap.docs.map(d => {
      const r = d.data();
      return `<tr>
        <td class="fw4">${r.date}</td>
        <td>${(r.items||[]).length} items</td>
        <td>${(r.lowItems||[]).length > 0 ? `<span class="badge badge-warn">${r.lowItems.length} low</span>` : '<span class="badge badge-ok">All OK</span>'}</td>
        <td>${r.staffName}</td>
      </tr>`;
    }).join('');
  } catch(e) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:16px;color:#ef4444">Error loading history.</td></tr>';
  }
}
