<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f2318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eden 54">
<title>SOPs · Eden 54 Portal</title>
<link rel="icon" type="image/jpeg" href="/logo/eden 54 logo.jpeg">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/portal/portal.css">
<style>
  /* ── SOP grid & cards ── */
  .sop-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(272px, 1fr));
    gap: 16px;
  }
  .sop-card {
    background: #fff;
    border: 1px solid #e4e4df;
    border-radius: 8px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .sop-card:hover { border-color: #C9A96E; box-shadow: 0 2px 10px rgba(0,0,0,.07); }
  .sop-card-title { font-size: 1rem; font-weight: 400; color: #0f2318; line-height: 1.35; }
  .sop-card-pos   { font-size: 0.8rem; color: #6a6b62; margin-top: 2px; }
  .sop-card-badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge-ver  { background: #f5f9f5; border: 1px solid #C9A96E; color: #0f2318; font-size: 0.68rem; padding: 2px 8px; border-radius: 20px; }
  .badge-role { background: #0f2318; color: #C9A96E;  font-size: 0.68rem; padding: 2px 8px; border-radius: 20px; }
  .badge-dept { background: #1a3a26; color: #C9A96E;  font-size: 0.68rem; padding: 2px 8px; border-radius: 20px; }

  /* ── Tabs ── */
  .tab-bar { display: flex; border-bottom: 2px solid #e4e4df; margin-bottom: 24px; }
  .tab-btn {
    padding: 10px 22px; background: none; border: none;
    border-bottom: 2px solid transparent; margin-bottom: -2px;
    cursor: pointer; font-family: 'Jost', sans-serif;
    font-size: 0.88rem; color: #6a6b62;
    transition: color 0.2s, border-color 0.2s;
  }
  .tab-btn.active { color: #0f2318; border-bottom-color: #C9A96E; font-weight: 500; }

  /* ── SOP Viewer overlay ── */
  .sop-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    z-index: 900; display: none; overflow-y: auto; padding: 24px 16px;
    -webkit-overflow-scrolling: touch;
  }
  .sop-overlay.open { display: block; }
  .sop-overlay-inner {
    background: #f8f8f5; border-radius: 10px;
    max-width: 840px; margin: 0 auto; padding: 28px 24px;
    position: relative;
  }
  .sop-overlay-close {
    position: absolute; top: 14px; right: 14px;
    background: #fff; border: 1px solid #e4e4df; border-radius: 50%;
    width: 32px; height: 32px; font-size: 1.1rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center; color: #6a6b62;
    z-index: 1;
  }
  /* ── SOP Document ── */
  .sop-doc { max-width: 780px; margin: 0 auto; }
  .sop-cover {
    background: linear-gradient(135deg, #0f2318 0%, #1a3a26 100%);
    color: #fff; padding: 26px 30px; border-radius: 8px; margin-bottom: 18px;
  }
  .sop-cover-sup { font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: #C9A96E; margin-bottom: 10px; }
  .sop-cover-title { font-size: 1.3rem; font-weight: 400; line-height: 1.3; margin-bottom: 5px; }
  .sop-cover-pos { font-size: 0.85rem; color: rgba(255,255,255,.6); margin-bottom: 16px; }
  .sop-cover-meta {
    display: flex; gap: 18px; flex-wrap: wrap;
    border-top: 1px solid rgba(255,255,255,.15); padding-top: 12px;
    font-size: 0.77rem; color: rgba(255,255,255,.55);
  }
  .sop-cover-meta span strong { color: #C9A96E; font-weight: 400; margin-right: 4px; }
  .sop-block { margin-bottom: 12px; border: 1px solid #e4e4df; border-radius: 6px; overflow: hidden; }
  .sop-block-head {
    background: #0f2318; color: #fff;
    padding: 8px 14px; display: flex; align-items: center; gap: 12px;
  }
  .sop-block-head.sub { background: #1a3a26; }
  .sop-num {
    background: #C9A96E; color: #0f2318;
    font-size: 0.66rem; font-weight: 500; padding: 2px 7px;
    border-radius: 4px; min-width: 32px; text-align: center; flex-shrink: 0;
  }
  .sop-block-head.sub .sop-num { background: transparent; border: 1px solid rgba(201,169,110,.5); color: #C9A96E; }
  .sop-heading { font-size: 0.88rem; font-weight: 400; letter-spacing: 0.02em; }
  .sop-body { padding: 13px 14px; background: #fff; }
  .sop-body p { font-size: 0.855rem; color: #3a3b34; line-height: 1.7; margin: 0 0 8px; }
  .sop-body p:last-child { margin-bottom: 0; }
  .sop-items { list-style: none; padding: 0; margin: 8px 0 0; }
  .sop-items li {
    display: flex; gap: 10px; padding: 7px 0;
    border-bottom: 1px solid #f0efe9;
    font-size: 0.855rem; line-height: 1.6; color: #3a3b34;
  }
  .sop-items li:last-child { border-bottom: none; }
  .sop-item-n {
    min-width: 20px; height: 20px; border-radius: 50%;
    background: #C9A96E; color: #0f2318;
    font-size: 0.65rem; font-weight: 500;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 3px;
  }
  .sop-item-t { flex: 1; }
  .sop-item-t strong { font-weight: 500; color: #0f2318; }
  .sop-footer { display: flex; justify-content: center; gap: 10px; margin-top: 22px; padding-top: 16px; border-top: 1px solid #e4e4df; }

  /* ── Editor ── */
  .ed-section {
    border: 1px solid #e4e4df; border-radius: 6px;
    padding: 14px; margin-bottom: 10px; background: #fdfdfc;
  }
  .ed-section-hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .fg-num-title { display: grid; grid-template-columns: 80px 1fr; gap: 8px; margin-bottom: 8px; }
  .btn-sm {
    padding: 4px 10px; font-size: 0.75rem; border-radius: 4px;
    border: 1px solid #e4e4df; background: #fff;
    cursor: pointer; font-family: 'Jost', sans-serif; color: #3a3b34;
    transition: border-color 0.15s;
  }
  .btn-sm:hover { border-color: #C9A96E; }
  .btn-sm.danger { border-color: #ef4444; color: #ef4444; }
  .btn-sm.danger:hover { background: #fef2f2; }
  .btn-sm.gold { border-color: #C9A96E; color: #0f2318; }

  .check-grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .check-label {
    display: flex; align-items: center; gap: 6px;
    font-size: 0.84rem; cursor: pointer; padding: 4px 10px;
    border: 1px solid #e4e4df; border-radius: 20px; background: #fff;
    transition: border-color 0.15s, background 0.15s;
  }
  .check-label:has(input:checked) { border-color: #C9A96E; background: #f5f9f5; }
  .check-label input { cursor: pointer; }

  /* ── Editor modal overlay ── */
  #sopEditorModal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 9000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-box {
    background: var(--card, #f8f8f5);
    border: 1px solid var(--border, #e4e4df);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    max-height: 90vh;
    width: 100%;
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; border-bottom: 1px solid var(--border, #e4e4df);
    font-size: 0.9rem; font-weight: 500; flex-shrink: 0;
    background: var(--card, #f8f8f5);
  }
  .modal-body { flex: 1; overflow-y: auto; padding: 18px 20px; }
  .modal-foot {
    display: flex; gap: 8px; justify-content: flex-end;
    padding: 12px 20px; border-top: 1px solid var(--border, #e4e4df);
    flex-shrink: 0; background: var(--card, #f8f8f5);
  }
  .modal-x {
    background: none; border: 1px solid var(--border, #e4e4df);
    border-radius: 50%; width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 1.1rem; color: #6a6b62; flex-shrink: 0;
    font-family: inherit;
  }
  @media (max-width: 600px) {
    #sopEditorModal { padding: 10px; }
    .modal-body { padding: 14px 14px; }
    .modal-head, .modal-foot { padding: 12px 14px; }
  }
  /* ── Print ── */
  @media print {
    .sidebar, .topbar, .sop-overlay-close, .sop-footer,
    .tab-bar, #panelAll { display: none !important; }
    .sop-overlay { display: block !important; position: static;
      background: none; padding: 0; overflow: visible; }
    .sop-overlay-inner { background: none; padding: 0; box-shadow: none; }
    .sop-cover { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .sop-block-head { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
  @media (max-width: 600px) {
    .sop-overlay-inner { padding: 18px 14px; }
    .sop-cover { padding: 20px; }
  }
</style>
</head>
<body>
<div class="sb-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<aside class="sidebar" id="sidebar">
  <div class="sb-brand"><div class="sb-brand-name">Eden 54</div><div class="sb-brand-sub">Staff Portal</div></div>
  <nav class="sb-nav" id="sbNav"></nav>
  <div class="sb-foot"><div id="sidebarUser"></div><a class="sb-item" onclick="switchProfile()" style="cursor:pointer"><i class="sb-icon">🔄</i> Switch Profile</a></div>
</aside>

<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <button class="hamburger" onclick="toggleSidebar()"><div></div><div></div><div></div></button>
      <h1>Standard Operating Procedures</h1>
    </div>
    <div class="topbar-date" id="topDate"></div>
  </div>

  <div class="content">
    <div id="alertBox" class="alert"></div>

    <div class="tab-bar" id="tabBar">
      <button class="tab-btn active" onclick="switchTab('my')"  id="tabMy">My SOPs</button>
      <button class="tab-btn"        onclick="switchTab('all')" id="tabAll" style="display:none">Manage SOPs</button>
    </div>

    <!-- My SOPs -->
    <div id="panelMy">
      <div id="mySopGrid" class="sop-grid">
        <p class="text-muted" style="font-size:0.85rem">Loading…</p>
      </div>
    </div>

    <!-- All SOPs (CEO / HR) -->
    <div id="panelAll" style="display:none">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px">
        <div style="font-size:0.84rem;color:#6a6b62" id="allSopCount"></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn" id="loadDefaultsBtn" onclick="seedMissingSops()" style="display:none">Load Default SOPs</button>
          <button class="btn btn-gold" onclick="openEditor(null)">+ New SOP</button>
        </div>
      </div>
      <div id="allSopGrid" class="sop-grid"></div>
    </div>

  </div>
</div>

<!-- ── SOP Viewer overlay ── -->
<div class="sop-overlay" id="sopOverlay">
  <div class="sop-overlay-inner">
    <button class="sop-overlay-close" onclick="closeViewer()" title="Close">×</button>
    <div class="sop-doc" id="sopDocContent"></div>
    <div class="sop-footer">
      <button class="btn" onclick="window.print()">Print / Save PDF</button>
      <button class="btn" onclick="closeViewer()">Close</button>
    </div>
  </div>
</div>

<!-- ── SOP Editor modal (CEO / HR) ── -->
<div class="modal" id="sopEditorModal">
  <div class="modal-box" style="max-width:700px;width:100%">
    <div class="modal-head">
      <span id="edModalTitle">New SOP</span>
      <button class="modal-x" onclick="closeEditor()">×</button>
    </div>
    <div class="modal-body" style="max-height:70vh;overflow-y:auto">
      <div id="edAlert" class="alert" style="margin-bottom:12px;display:none"></div>

      <div class="fg2">
        <div class="form-group">
          <label class="form-label">SOP Title</label>
          <input type="text" id="edTitle" class="form-control" placeholder="e.g. Facility Manager SOP">
        </div>
        <div class="form-group">
          <label class="form-label">Position / Role</label>
          <input type="text" id="edPosition" class="form-control" placeholder="e.g. Facility Manager">
        </div>
      </div>
      <div class="fg2" style="margin-bottom:4px">
        <div class="form-group">
          <label class="form-label">Version</label>
          <input type="text" id="edVersion" class="form-control" placeholder="1.0">
        </div>
        <div class="form-group">
          <label class="form-label">Location</label>
          <input type="text" id="edLocation" class="form-control" value="Eden54">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Assign to Roles</label>
        <div class="check-grid" id="edRolesGrid"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Assign to Departments</label>
        <div class="check-grid" id="edDeptsGrid"></div>
      </div>

      <div class="divider"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <strong style="font-size:0.88rem">Sections</strong>
        <button class="btn-sm gold" onclick="addEdSection()">+ Add Section</button>
      </div>
      <div id="edSections"></div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeEditor()">Cancel</button>
      <button class="btn btn-gold" id="edSaveBtn" onclick="saveSop()">Save SOP</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="/portal/firebase-init.js"></script>
<script>
const currentStaff = getStaff();
requireAccess(currentStaff, 'sops');
populateSidebar(currentStaff);
buildNav(currentStaff, 'sops');
document.getElementById('topDate').textContent =
  new Date().toLocaleDateString('en-NG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

const _rawRole  = (currentStaff.accessLevel || currentStaff.role || '').toLowerCase().replace(/\s+/g,'');
const isCEO     = _rawRole === 'superadmin' || _rawRole === 'ceo';
const isManager = isCEO || _rawRole === 'manager' || _rawRole.includes('manager');
const isHR      = _rawRole === 'hr' || (currentStaff.department||'').toLowerCase().includes('hr');
const canManage = isCEO || isHR;

if (canManage) {
  document.getElementById('tabAll').style.display = '';
}

// ── Legacy dept name → canonical mapping (same as expenses page) ───────────
const _LEGACY_DEPT = {
  lounge: 'Bar & Lounge', bar: 'Bar & Lounge', 'bar & lounge': 'Bar & Lounge', games: 'Bar & Lounge',
  salon: 'Salon', barbing: 'Salon',
  kitchen: 'Kitchen',
  pool: 'Pool',
  apartment: 'Apartments', apartments: 'Apartments',
  'front desk': 'Front Desk', receptionist: 'Front Desk',
  hr: 'HR',
  management: 'Management',
};
function _canonDept(raw) {
  const lower = (raw || '').trim().toLowerCase();
  return _LEGACY_DEPT[lower] || (raw || '').trim();
}

// ── Constants ──────────────────────────────────────────────────────────────
const ALL_ROLES = [
  { value: 'superadmin', label: 'CEO / Admin' },
  { value: 'manager',    label: 'Manager' },
  { value: 'hr',         label: 'HR' },
];
const ALL_DEPTS = [
  'Bar & Lounge', 'Kitchen', 'Apartments', 'Pool', 'Salon', 'Front Desk'
];

// ── State ──────────────────────────────────────────────────────────────────
let _allSops   = [];
let _editSopId = null;

// ── Load ───────────────────────────────────────────────────────────────────
async function loadSops() {
  try {
    const snap = await db.collection('sops').where('isActive', '==', true).get();
    _allSops = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    _allSops.sort((a, b) => (a.title || '').localeCompare(b.title || ''));
    renderMySops();
    if (canManage) {
      renderAllSops();
      if (!_allSops.length) seedDefault();
    }
  } catch(e) {
    console.error('loadSops:', e);
    document.getElementById('mySopGrid').innerHTML =
      '<p style="font-size:0.85rem;color:#ef4444">Error loading SOPs. Check your connection.</p>';
  }
}

// ── Render: My SOPs ────────────────────────────────────────────────────────
function renderMySops() {
  const grid = document.getElementById('mySopGrid');
  // CEO and HR see every SOP regardless of assignment
  if (isCEO || isHR) {
    if (!_allSops.length) {
      grid.innerHTML = '<div class="card" style="padding:24px;text-align:center;color:#6a6b62;font-size:0.875rem">No SOPs yet. Use "Manage SOPs" to load or create them.</div>';
      return;
    }
    grid.innerHTML = _allSops.map(s => sopCard(s, false)).join('');
    return;
  }
  // Managers see all SOPs; other staff see only those assigned to their role/dept
  const role = (_rawRole || '');
  const dept = _canonDept(currentStaff.department || ''); // normalise legacy names
  const mine = _allSops.filter(s => {
    if (isManager) return true;
    const roles = s.assignedRoles || [];
    const depts = s.assignedDepts || [];
    // case-insensitive dept match handles any remaining capitalisation differences
    return roles.includes(role) ||
           depts.some(d => d.toLowerCase() === dept.toLowerCase());
  });
  if (!mine.length) {
    grid.innerHTML = '<div class="card" style="padding:24px;text-align:center;color:#6a6b62;font-size:0.875rem">No SOPs assigned to your role yet.</div>';
    return;
  }
  grid.innerHTML = mine.map(s => sopCard(s, false)).join('');
}

// ── Render: All SOPs ───────────────────────────────────────────────────────
const _DEFAULT_SOP_COUNT = 8; // Facility Manager + 7 role SOPs
function renderAllSops() {
  const grid  = document.getElementById('allSopGrid');
  const count = document.getElementById('allSopCount');
  count.textContent = `${_allSops.length} SOP${_allSops.length !== 1 ? 's' : ''}`;
  // Show the "Load Default SOPs" button whenever some defaults are missing
  const loadBtn = document.getElementById('loadDefaultsBtn');
  if (loadBtn) loadBtn.style.display = _allSops.length < _DEFAULT_SOP_COUNT ? '' : 'none';
  if (!_allSops.length) {
    grid.innerHTML = '<div class="card" style="padding:24px;text-align:center;color:#6a6b62;font-size:0.875rem">No SOPs yet. Click "Load Default SOPs" to set up all roles, or "+ New SOP" to create one manually.</div>';
    return;
  }
  grid.innerHTML = _allSops.map(s => sopCard(s, true)).join('');
}

// ── SOP card HTML ──────────────────────────────────────────────────────────
function sopCard(s, showAdmin) {
  const roleLabels = (s.assignedRoles || []).map(r => {
    const f = ALL_ROLES.find(x => x.value === r);
    return `<span class="badge-role">${f ? f.label : r}</span>`;
  }).join('');
  const deptLabels = (s.assignedDepts || []).map(d =>
    `<span class="badge-dept">${esc(d)}</span>`
  ).join('');

  const adminBtns = showAdmin
    ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:auto">
         <button class="btn-sm" onclick="viewSop('${esc(s.id)}')">View</button>
         <button class="btn-sm gold" onclick="openEditor('${esc(s.id)}')">Edit</button>
         <button class="btn-sm danger" onclick="confirmDelete('${esc(s.id)}','${esc(s.title||'')}')">Delete</button>
       </div>`
    : `<button class="btn btn-gold" onclick="viewSop('${esc(s.id)}')" style="width:100%;margin-top:auto">View SOP</button>`;

  return `<div class="sop-card">
    <div>
      <div class="sop-card-title">${esc(s.title || 'Untitled SOP')}</div>
      <div class="sop-card-pos">${esc(s.position || '')}</div>
    </div>
    <div class="sop-card-badges">
      <span class="badge-ver">v${esc(s.version || '1.0')}</span>
      ${roleLabels}${deptLabels}
    </div>
    ${adminBtns}
  </div>`;
}

// ── Tab switch ─────────────────────────────────────────────────────────────
function switchTab(tab) {
  document.getElementById('panelMy').style.display  = tab === 'my'  ? '' : 'none';
  document.getElementById('panelAll').style.display = tab === 'all' ? '' : 'none';
  document.getElementById('tabMy').classList.toggle('active',  tab === 'my');
  document.getElementById('tabAll').classList.toggle('active', tab === 'all');
}

// ── Viewer ─────────────────────────────────────────────────────────────────
function viewSop(id) {
  const s = _allSops.find(x => x.id === id);
  if (!s) return;
  document.getElementById('sopDocContent').innerHTML = renderSopDoc(s);
  document.getElementById('sopOverlay').classList.add('open');
  document.getElementById('sopOverlay').scrollTop = 0;
}
function closeViewer() {
  document.getElementById('sopOverlay').classList.remove('open');
}
document.getElementById('sopOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('sopOverlay')) closeViewer();
});

function renderSopDoc(s) {
  let html = `<div class="sop-cover">
    <div class="sop-cover-sup">Standard Operating Procedure</div>
    <div class="sop-cover-title">${esc(s.title || '')}</div>
    <div class="sop-cover-pos">${esc(s.position || '')}</div>
    <div class="sop-cover-meta">
      <span><strong>Location:</strong>${esc(s.location || 'Eden54')}</span>
      <span><strong>Version:</strong>${esc(s.version || '1.0')}</span>
    </div>
  </div>`;

  (s.sections || []).forEach(sec => {
    const num = (sec.number || '').trim();
    const isSub = num && !num.endsWith('.0') && num.includes('.');
    html += `<div class="sop-block">
      <div class="sop-block-head${isSub ? ' sub' : ''}">
        <span class="sop-num">${esc(num)}</span>
        <span class="sop-heading">${esc(sec.heading || '')}</span>
      </div>
      <div class="sop-body">
        ${sec.body ? `<p>${esc(sec.body).replace(/\n/g,'<br>')}</p>` : ''}
        ${renderItems(sec.items)}
      </div>
    </div>`;
  });
  return html;
}

function renderItems(items) {
  if (!items || !items.length) return '';
  const lis = items.filter(Boolean).map((item, i) => {
    const ci = item.indexOf(': ');
    let inner;
    if (ci !== -1) {
      inner = `<strong>${esc(item.substring(0, ci))}:</strong> ${esc(item.substring(ci + 2))}`;
    } else {
      inner = esc(item);
    }
    return `<li><div class="sop-item-n">${i+1}</div><div class="sop-item-t">${inner}</div></li>`;
  }).join('');
  return `<ol class="sop-items">${lis}</ol>`;
}

function buildCheckGrid(containerId, options, checked, valueKey, labelKey) {
  document.getElementById(containerId).innerHTML = options.map(o => {
    const val   = typeof o === 'string' ? o : o[valueKey];
    const label = typeof o === 'string' ? o : o[labelKey];
    const chk   = (checked || []).includes(val) ? 'checked' : '';
    return `<label class="check-label"><input type="checkbox" value="${esc(val)}" ${chk}> ${esc(label)}</label>`;
  }).join('');
}

function openEditor(id) {
  _editSopId = id;
  const existing = id ? _allSops.find(x => x.id === id) : null;

  document.getElementById('edModalTitle').textContent = id ? 'Edit SOP' : 'New SOP';
  document.getElementById('edTitle').value    = existing?.title    || '';
  document.getElementById('edPosition').value = existing?.position || '';
  document.getElementById('edVersion').value  = existing?.version  || '1.0';
  document.getElementById('edLocation').value = existing?.location || 'Eden54';
  document.getElementById('edAlert').style.display = 'none';

  buildCheckGrid('edRolesGrid', ALL_ROLES, existing?.assignedRoles || [], 'value', 'label');
  buildCheckGrid('edDeptsGrid', ALL_DEPTS, existing?.assignedDepts || [], null, null);

  renderEdSections(existing?.sections || []);
  document.getElementById('sopEditorModal').style.display = 'flex';
}

function closeEditor() {
  document.getElementById('sopEditorModal').style.display = 'none';
}

function renderEdSections(sections) {
  document.getElementById('edSections').innerHTML = sections.map((sec, i) =>
    edSectionHtml(i, sec, sections.length)
  ).join('');
}

function edSectionHtml(i, sec, total) {
  return `<div class="ed-section" id="edSec${i}" data-idx="${i}">
    <div class="ed-section-hd">
      <span style="font-size:0.82rem;font-weight:500;color:#6a6b62">Section ${i+1}</span>
      <div style="display:flex;gap:6px">
        ${i > 0        ? `<button class="btn-sm" onclick="moveSection(${i},-1)">↑</button>` : ''}
        ${i < total-1  ? `<button class="btn-sm" onclick="moveSection(${i},1)">↓</button>`  : ''}
        <button class="btn-sm danger" onclick="removeSection(${i})">Remove</button>
      </div>
    </div>
    <div class="fg-num-title">
      <div class="form-group" style="margin-bottom:0">
        <label class="form-label" style="font-size:0.72rem">Number</label>
        <input type="text" class="form-control sec-number" placeholder="2.1" value="${esc(sec.number||'')}">
      </div>
      <div class="form-group" style="margin-bottom:0">
        <label class="form-label" style="font-size:0.72rem">Heading</label>
        <input type="text" class="form-control sec-heading" placeholder="Section heading" value="${esc(sec.heading||'')}">
      </div>
    </div>
    <div class="form-group" style="margin:8px 0 0">
      <label class="form-label" style="font-size:0.72rem">Introductory Paragraph (optional)</label>
      <textarea class="form-control sec-body" rows="2" placeholder="Opening sentence or paragraph for this section…">${esc(sec.body||'')}</textarea>
    </div>
    <div class="form-group" style="margin:8px 0 0">
      <label class="form-label" style="font-size:0.72rem">Items — one per line. Use "Label: Description" for bold labels.</label>
      <textarea class="form-control sec-items" rows="4" placeholder="Punctuality: Arrive on time before the first shift.&#10;Grooming: Be in full, clean uniform at all times.">${esc((sec.items||[]).join('\n'))}</textarea>
    </div>
  </div>`;
}

function collectEdSections() {
  return [...document.querySelectorAll('#edSections .ed-section')].map(el => ({
    number:  el.querySelector('.sec-number').value.trim(),
    heading: el.querySelector('.sec-heading').value.trim(),
    body:    el.querySelector('.sec-body').value.trim(),
    items:   el.querySelector('.sec-items').value.split('\n').map(l => l.trim()).filter(Boolean),
  }));
}

function addEdSection() {
  const current = collectEdSections();
  current.push({ number: '', heading: '', body: '', items: [] });
  renderEdSections(current);
  document.getElementById('edSections').lastElementChild?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function removeSection(i) {
  const sections = collectEdSections();
  sections.splice(i, 1);
  renderEdSections(sections);
}

function moveSection(i, dir) {
  const sections = collectEdSections();
  const j = i + dir;
  if (j < 0 || j >= sections.length) return;
  [sections[i], sections[j]] = [sections[j], sections[i]];
  renderEdSections(sections);
}

async function saveSop() {
  const title    = document.getElementById('edTitle').value.trim();
  const position = document.getElementById('edPosition').value.trim();
  const version  = document.getElementById('edVersion').value.trim() || '1.0';
  const location = document.getElementById('edLocation').value.trim() || 'Eden54';

  const assignedRoles = [...document.querySelectorAll('#edRolesGrid input:checked')].map(x => x.value);
  const assignedDepts = [...document.querySelectorAll('#edDeptsGrid input:checked')].map(x => x.value);
  const sections = collectEdSections();

  const alertEl = document.getElementById('edAlert');
  if (!title) {
    alertEl.className = 'alert alert-error';
    alertEl.textContent = 'Please enter a title for this SOP.';
    alertEl.style.display = 'block';
    return;
  }
  alertEl.style.display = 'none';

  const btn = document.getElementById('edSaveBtn');
  btn.disabled = true; btn.textContent = 'Saving…';

  const data = {
    title, position, version, location,
    assignedRoles, assignedDepts, sections,
    isActive: true,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    updatedBy: currentStaff.name || currentStaff.id,
  };

  try {
    if (_editSopId) {
      await db.collection('sops').doc(_editSopId).update(data);
    } else {
      data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      data.createdBy = currentStaff.name || currentStaff.id;
      await db.collection('sops').add(data);
    }
    closeEditor();
    await loadSops();
    showAlert('alertBox', _editSopId ? 'SOP updated.' : 'SOP created.', 'alert-success');
  } catch(e) {
    console.error(e);
    alertEl.className = 'alert alert-error';
    alertEl.textContent = 'Error saving SOP. Please try again.';
    alertEl.style.display = 'block';
  }

  btn.disabled = false; btn.textContent = 'Save SOP';
}

async function confirmDelete(id, title) {
  if (!confirm(`Delete "${title}"?\n\nThis SOP will no longer be visible to any staff. This cannot be undone.`)) return;
  try {
    await db.collection('sops').doc(id).delete();
    await loadSops();
    showAlert('alertBox', 'SOP deleted.', 'alert-success');
  } catch(e) {
    showAlert('alertBox', 'Error deleting SOP.', 'alert-error');
  }
}

    // Only create SOPs whose title doesn't already exist — safe to call repeatedly
    const existingTitles = new Set(_allSops.map(s => s.title));
    const missing = SOPS.filter(s => !existingTitles.has(s.title));
    if (!missing.length) return;
    await Promise.all(missing.map(s => db.collection('sops').add({
      location: 'Eden54',
      version: s.version || '1.0',
      isActive: true,
      createdBy: 'system',
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      ...s
    })));
    await loadSops();
