<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f2318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eden 54">
<title>Open Tabs · Eden 54 Portal</title>
<link rel="icon" type="image/jpeg" href="/logo/eden 54 logo.jpeg">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/portal/portal.css">
<style>
/* ── Toolbar ── */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.status-pill{padding:6px 16px;border:1px solid var(--border);border-radius:20px;
  font-family:'Jost',sans-serif;font-size:0.7rem;letter-spacing:0.08em;text-transform:uppercase;
  color:var(--muted);cursor:pointer;background:transparent;transition:all .2s;white-space:nowrap}
.status-pill.active,.status-pill:hover{border-color:var(--gold);color:var(--gold);background:rgba(201,169,110,0.08)}
.toolbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.sort-select{font-size:0.72rem;padding:5px 10px;border:1px solid var(--border);border-radius:4px;
  background:var(--card);color:var(--muted);font-family:'Jost',sans-serif;cursor:pointer}

/* ── Stats ── */
.tab-stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.tab-stat{flex:1;min-width:90px;text-align:center;padding:12px 10px;background:var(--card);border:1px solid var(--border);border-radius:8px}
.tab-stat .lbl{font-size:0.6rem;color:var(--muted);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:5px}
.tab-stat .val{font-size:0.95rem;font-weight:400;color:var(--text)}
.tab-stat.gold-stat{background:#fff8ec;border:1px solid rgba(201,169,110,0.25)}
.tab-stat.gold-stat .val{color:var(--gold)}

/* ── Tab grid ── */
.tabs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}

/* ── Tab card ── */
.tab-card{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.tab-card.age-warn{border-color:rgba(234,179,8,0.45)}
.tab-card.age-old{border-color:rgba(239,68,68,0.45)}
.tab-card-top{padding:14px 16px 10px;flex:1}
.tab-card-footer{padding:9px 16px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}

/* ── Status badges ── */
.s-badge{font-size:0.6rem;letter-spacing:0.07em;text-transform:uppercase;padding:2px 9px;border-radius:3px;font-weight:500}
.s-open    {background:#dcfce7;color:#166534}
.s-await   {background:#fef9c3;color:#854d0e}
.s-pos     {background:#dbeafe;color:#1e40af}

/* ── Age badge ── */
.age-badge{font-size:0.62rem;padding:2px 8px;border-radius:3px;font-weight:500}
.age-ok  {background:#f0fdf4;color:#166534}
.age-warn{background:#fef9c3;color:#854d0e}
.age-old {background:#fee2e2;color:#991b1b}

/* ── Card content ── */
.tc-customer{font-size:0.92rem;color:var(--text);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-table{font-size:0.72rem;color:var(--muted);margin-bottom:10px}
.tc-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:0.75rem;color:var(--muted);margin-top:4px}
.tc-val{color:var(--text)}
.tc-badges{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* ── Empty ── */
.empty-state{text-align:center;padding:40px 20px;color:var(--muted);font-size:0.85rem;grid-column:1/-1}
.empty-icon{font-size:2.4rem;margin-bottom:12px;opacity:0.5}

/* ── Tablet ── */
@media(max-width:900px){
  .tabs-grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
}

/* ── Mobile ── */
@media(max-width:480px){
  .toolbar{gap:8px}
  .status-pill{padding:5px 11px;font-size:0.66rem}
  .tabs-grid{grid-template-columns:1fr;gap:10px}
  .tab-stat{flex:1 1 calc(50% - 5px);min-width:0}
  .toolbar-right{width:100%}
  .sort-select{width:100%}
}

@media(max-width:360px){
  .status-pill{padding:5px 9px;font-size:0.62rem;letter-spacing:0.04em}
}
</style>
</head>
<body>
<div class="sb-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<aside class="sidebar" id="sidebar">
  <div class="sb-brand"><div class="sb-brand-name">Eden 54</div><div class="sb-brand-sub">Staff Portal</div></div>
  <nav class="sb-nav" id="sbNav"></nav>
  <div class="sb-foot"><div id="sidebarUser"></div><a class="sb-item" onclick="switchProfile()" style="cursor:pointer"><i class="sb-icon">🔄</i> Switch Profile</a></div>
</aside>

<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <button class="hamburger" onclick="toggleSidebar()"><div></div><div></div><div></div></button>
      <h1>Open Tabs</h1>
    </div>
    <div class="topbar-right">
      <button class="btn btn-gold btn-sm" onclick="loadTabs()">🔄 Refresh</button>
    </div>
  </div>

  <div class="content">
    <div id="alertBox" class="alert"></div>

    <!-- ── Stats ── -->
    <div class="tab-stats" id="tabStats"></div>

    <!-- ── Filters ── -->
    <div class="toolbar">
      <button class="status-pill active" data-status="all"       onclick="setFilter(this)">All</button>
      <button class="status-pill"        data-status="open"      onclick="setFilter(this)">🟢 Open</button>
      <button class="status-pill"        data-status="awaiting"  onclick="setFilter(this)">🟡 Bill Req.</button>
      <button class="status-pill"        data-status="awaiting-pos" onclick="setFilter(this)">🔵 At POS</button>
      <div class="toolbar-right">
        <select class="sort-select" id="sortSelect" onchange="render()">
          <option value="age-desc">Oldest first</option>
          <option value="age-asc">Newest first</option>
          <option value="amount-desc">Highest value</option>
        </select>
      </div>
    </div>

    <!-- ── Cards ── -->
    <div class="tabs-grid" id="tabsGrid">
      <div style="color:var(--muted);padding:24px 0;text-align:center;grid-column:1/-1">Loading…</div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="/portal/firebase-init.js"></script>
<script>
const currentStaff = getStaff();
requireAccess(currentStaff, 'open-tabs');
populateSidebar(currentStaff);
buildNav(currentStaff, 'open-tabs');
document.getElementById('topDate') && (document.getElementById('topDate').textContent =
  new Date().toLocaleDateString('en-NG', {weekday:'long', year:'numeric', month:'long', day:'numeric'}));

function N(n)   { return fmtNaira(n || 0); }
function esc(s) { return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

let _tabs       = [];
let _statusFilter = 'all';

function tabAgeMinutes(r) {
  if (!r.createdAt?.seconds) return 0;
  return Math.floor((Date.now() / 1000 - r.createdAt.seconds) / 60);
}

function fmtAge(mins) {
  if (mins < 60)   return mins + 'm';
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return h + 'h ' + (m > 0 ? m + 'm' : '');
}

function ageClass(mins) {
  if (mins >= 180) return 'age-old';
  if (mins >= 120) return 'age-warn';
  return '';
}

function ageBadgeClass(mins) {
  if (mins >= 180) return 'age-old';
  if (mins >= 120) return 'age-warn';
  return 'age-ok';
}

function statusLabel(s) {
  if (s === 'awaiting-pos') return 'At POS';
  if (s === 'awaiting')     return 'Bill Req.';
  return 'Open';
}

function statusBadgeClass(s) {
  if (s === 'awaiting-pos') return 's-pos';
  if (s === 'awaiting')     return 's-await';
  return 's-open';
}

function setFilter(btn) {
  document.querySelectorAll('.status-pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  _statusFilter = btn.dataset.status;
  render();
}

function render() {
  const gridEl  = document.getElementById('tabsGrid');
  const statsEl = document.getElementById('tabStats');
  const sort    = document.getElementById('sortSelect').value;

  const visible = _statusFilter === 'all'
    ? _tabs
    : _tabs.filter(t => t.status === _statusFilter);

  const sorted = [...visible].sort((a, b) => {
    if (sort === 'age-desc')    return tabAgeMinutes(b) - tabAgeMinutes(a); /* oldest = highest age */
    if (sort === 'age-asc')     return tabAgeMinutes(a) - tabAgeMinutes(b);
    if (sort === 'amount-desc') return (b.subtotal || 0) - (a.subtotal || 0);
    return 0;
  });

  /* Stats */
  const total     = _tabs.reduce((s, t) => s + (t.subtotal || 0), 0);
  const countPos  = _tabs.filter(t => t.status === 'awaiting-pos').length;
  const countBill = _tabs.filter(t => t.status === 'awaiting').length;
  statsEl.innerHTML =
    `<div class="tab-stat gold-stat"><div class="lbl">Open Tabs</div><div class="val">${_tabs.length}</div></div>` +
    `<div class="tab-stat gold-stat"><div class="lbl">Total Value</div><div class="val">${N(total)}</div></div>` +
    (countPos  ? `<div class="tab-stat"><div class="lbl">At POS</div><div class="val" style="color:#1e40af">${countPos}</div></div>` : '') +
    (countBill ? `<div class="tab-stat"><div class="lbl">Bill Requested</div><div class="val" style="color:#854d0e">${countBill}</div></div>` : '');

  if (!sorted.length) {
    gridEl.innerHTML = '<div class="empty-state"><div class="empty-icon">🗂️</div><div>No open tabs matching this filter.</div></div>';
    return;
  }

  gridEl.innerHTML = sorted.map(t => {
    const mins   = tabAgeMinutes(t);
    const server = t.servingStaff?.name || t.openedBy?.name || '—';
    const items  = (t.items || []).length;
    const ac     = ageClass(mins);
    const abc    = ageBadgeClass(mins);
    const sbc    = statusBadgeClass(t.status);
    const sl     = statusLabel(t.status);

    /* Items preview — up to 3 names */
    const itemNames = (t.items || []).slice(0, 3).map(i => esc(i.name || i.title || '')).filter(Boolean);
    const itemPreview = itemNames.length
      ? itemNames.join(', ') + (items > 3 ? ` +${items - 3} more` : '')
      : `${items} item${items !== 1 ? 's' : ''}`;

    return `<div class="tab-card ${ac}">
      <div class="tab-card-top">
        <div class="tc-badges" style="margin-bottom:8px">
          <span class="s-badge ${sbc}">${sl}</span>
          <span class="age-badge ${abc}">${fmtAge(mins)}</span>
        </div>
        <div class="tc-customer">${esc(t.customerName || '—')}</div>
        <div class="tc-table">📍 ${esc(t.tableLabel || '—')}</div>
        <div class="tc-row"><span>Server</span><span class="tc-val">${esc(server)}</span></div>
        <div class="tc-row"><span>Items</span><span class="tc-val" title="${esc(itemPreview)}">${itemPreview}</span></div>
      </div>
      <div class="tab-card-footer">
        <span style="font-size:0.68rem;color:var(--muted)">Opened by ${esc(t.openedBy?.name || '—')}</span>
        <span style="font-size:0.92rem;color:var(--gold)">${N(t.subtotal || 0)}</span>
      </div>
    </div>`;
  }).join('');
}

async function loadTabs() {
  document.getElementById('tabsGrid').innerHTML =
    '<div style="color:var(--muted);padding:24px 0;text-align:center;grid-column:1/-1">Loading…</div>';
  document.getElementById('tabStats').innerHTML = '';
  try {
    const snap = await db.collection('tabs')
      .where('status', 'in', ['open', 'awaiting-pos', 'awaiting'])
      .get();
    _tabs = snap.docs.map(d => ({ _id: d.id, ...d.data() }));
    render();
  } catch(e) {
    document.getElementById('tabsGrid').innerHTML =
      `<div style="color:#ef4444;padding:16px 0;text-align:center;grid-column:1/-1">Failed to load: ${esc(e.message)}</div>`;
  }
}

loadTabs();
</script>
</body>
</html>
