<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f2318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eden 54">
<title>Payment Collection Log · Eden 54 Portal</title>
<link rel="icon" type="image/jpeg" href="/logo/eden 54 logo.jpeg">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/portal/portal.css">
<style>
/* ── Filter panel ── */
.filters-wrap{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:18px 22px;margin-bottom:20px;display:flex;flex-direction:column;gap:14px}
.filter-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.filter-lbl{font-size:0.62rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap;min-width:88px;flex-shrink:0}
.filter-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1}
.filter-divider{height:1px;background:var(--border)}
.date-inputs{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.date-arrow{font-size:0.8rem;color:var(--muted);flex-shrink:0}

/* ── Pills (method + view mode) ── */
.pay-pill{padding:6px 16px;border:1px solid var(--border);border-radius:20px;
  font-family:'Jost',sans-serif;font-size:0.7rem;letter-spacing:0.08em;text-transform:uppercase;
  color:var(--muted);cursor:pointer;background:transparent;transition:all .2s;white-space:nowrap}
.pay-pill.active,.pay-pill:hover{border-color:var(--gold);color:var(--gold);background:rgba(201,169,110,0.08)}
.pay-pill.warn-pill.active{border-color:rgba(217,119,6,0.6);color:#92400e;background:rgba(217,119,6,0.08)}
.pay-pill.warn-pill:hover{border-color:rgba(217,119,6,0.4);color:#92400e;background:rgba(217,119,6,0.06)}
.filter-row.dimmed{opacity:0.4;pointer-events:none}

/* ── Summary stats ── */
.plog-stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.plog-stat{flex:1;min-width:90px;text-align:center;padding:12px 10px;background:#f5f9f5;border-radius:8px}
.plog-stat .lbl{font-size:0.6rem;color:var(--muted);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:5px}
.plog-stat .val{font-size:0.95rem;font-weight:400;color:var(--text)}
.plog-stat.gold-stat{background:#fff8ec;border:1px solid rgba(201,169,110,0.25)}
.plog-stat.gold-stat .val{color:var(--gold)}
.plog-stat.warn-stat{background:#fffbf2;border:1px solid rgba(217,119,6,0.25)}
.plog-stat.warn-stat .val{color:#92400e}

/* ── Log rows (full log mode) ── */
.plog-row{padding:13px 0;border-bottom:1px solid var(--border)}
.plog-row:last-child{border-bottom:none}
.plog-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.plog-badges{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.plog-amt{color:var(--gold);font-size:0.95rem;font-weight:400;white-space:nowrap;flex-shrink:0}
.plog-meta{font-size:0.75rem;color:var(--muted);margin-top:3px}
.plog-collector{font-size:0.73rem;color:var(--muted);margin-top:2px}
.plog-date-tag{font-size:0.65rem;color:var(--muted);margin-top:2px;letter-spacing:0.04em}
.plog-row-actions{margin-top:6px}

/* ── Method badges ── */
.bdg-cash    {background:rgba(5,150,105,0.1);color:#065f46;border-radius:4px;padding:2px 8px;font-size:0.62rem;letter-spacing:0.06em;text-transform:uppercase;font-weight:500}
.bdg-pos     {background:rgba(59,130,246,0.1);color:#1e40af;border-radius:4px;padding:2px 8px;font-size:0.62rem;letter-spacing:0.06em;text-transform:uppercase;font-weight:500}
.bdg-transfer{background:rgba(139,92,246,0.1);color:#5b21b6;border-radius:4px;padding:2px 8px;font-size:0.62rem;letter-spacing:0.06em;text-transform:uppercase;font-weight:500}
.rem-pending {font-size:0.6rem;background:rgba(217,119,6,0.1);color:#92400e;border-radius:3px;padding:2px 7px;letter-spacing:0.05em;text-transform:uppercase;font-weight:500}
.rem-done    {font-size:0.6rem;background:rgba(5,150,105,0.1);color:#065f46;border-radius:3px;padding:2px 7px;letter-spacing:0.05em;text-transform:uppercase;font-weight:500}

/* ── Pending cash grouped view ── */
.coll-card{background:var(--card);border:1px solid var(--border);border-radius:8px;margin-bottom:14px;overflow:hidden}
.coll-header{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--border);background:#fffbf2}
.coll-name-wrap{display:flex;align-items:center;gap:10px}
.coll-avatar{width:34px;height:34px;border-radius:50%;background:rgba(201,169,110,0.15);border:1px solid rgba(201,169,110,0.3);display:flex;align-items:center;justify-content:center;font-size:0.85rem;flex-shrink:0;color:var(--gold)}
.coll-name{font-size:0.9rem;font-weight:400;color:var(--text)}
.coll-role{font-size:0.65rem;color:var(--muted);margin-top:2px;text-transform:capitalize}
.coll-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.coll-total-amt{font-size:1.05rem;color:#92400e;font-weight:400}
.coll-total-cnt{font-size:0.65rem;color:var(--muted);margin-top:1px;text-align:right}
.btn-mark-all{font-size:0.65rem;padding:6px 14px;border-radius:4px;border:1px solid rgba(217,119,6,0.4);background:rgba(217,119,6,0.08);color:#92400e;cursor:pointer;font-family:'Jost',sans-serif;letter-spacing:0.06em;text-transform:uppercase;transition:all .2s;white-space:nowrap}
.btn-mark-all:hover{background:rgba(217,119,6,0.18);border-color:#92400e}
.btn-mark-all:disabled{opacity:0.4;cursor:not-allowed}
.tx-list{padding:0 20px}
.tx-row{padding:11px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}
.tx-row:last-child{border-bottom:none}
.tx-left{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.tx-meta{font-size:0.78rem;color:var(--text)}
.tx-sub{font-size:0.67rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.tx-amt{font-size:0.88rem;color:#92400e;font-weight:400;white-space:nowrap}
.btn-mark-one{font-size:0.6rem;padding:4px 10px;border-radius:3px;border:1px solid rgba(5,150,105,0.3);background:rgba(5,150,105,0.06);color:#065f46;cursor:pointer;font-family:'Jost',sans-serif;letter-spacing:0.05em;text-transform:uppercase;transition:all .2s;white-space:nowrap}
.btn-mark-one:hover{background:rgba(5,150,105,0.14)}
.btn-mark-one:disabled{opacity:0.4;cursor:not-allowed}

/* ── Inline mark button on log rows ── */
.btn-mark-inline{font-size:0.58rem;padding:3px 9px;border-radius:3px;border:1px solid rgba(5,150,105,0.3);background:rgba(5,150,105,0.06);color:#065f46;cursor:pointer;font-family:'Jost',sans-serif;letter-spacing:0.05em;text-transform:uppercase;transition:all .2s}
.btn-mark-inline:hover{background:rgba(5,150,105,0.14)}
.btn-mark-inline:disabled{opacity:0.4;cursor:not-allowed}

/* ── Tablet ── */
@media(max-width:900px){
  .filters-wrap{padding:14px 16px;gap:12px}
  .filter-lbl{min-width:72px}
  .coll-header{padding:12px 16px}
  .tx-list{padding:0 16px}
}

/* ── Mobile ── */
@media(max-width:480px){
  .filters-wrap{padding:12px 14px;gap:10px}
  .filter-row{flex-direction:column;align-items:flex-start;gap:6px}
  .filter-lbl{min-width:unset}
  .date-inputs{flex-direction:column;align-items:stretch;width:100%}
  .date-arrow{display:none}
  .date-inputs input{width:100%}
  #deptFilter{width:100%}
  .pay-pill{padding:5px 11px;font-size:0.66rem}
  .plog-stat{flex:1 1 calc(50% - 5px);min-width:0}
  #loadBtn{width:100%}
  .coll-header{padding:10px 14px;flex-direction:column;align-items:flex-start;gap:10px}
  .coll-right{width:100%;justify-content:space-between}
  .tx-list{padding:0 14px}
  .tx-row{flex-wrap:wrap;gap:6px}
  .tx-right{width:100%;justify-content:space-between}
}

@media(max-width:360px){
  .pay-pill{padding:5px 9px;font-size:0.62rem;letter-spacing:0.04em}
  .filters-wrap{padding:10px 12px}
}
</style>
</head>
<body>
<div class="sb-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<aside class="sidebar" id="sidebar">
  <div class="sb-brand"><div class="sb-brand-name">Eden 54</div><div class="sb-brand-sub">Staff Portal</div></div>
  <nav class="sb-nav" id="sbNav"></nav>
  <div class="sb-foot"><div id="sidebarUser"></div><a class="sb-item" onclick="switchProfile()" style="cursor:pointer"><i class="sb-icon">🔄</i> Switch Profile</a></div>
</aside>

<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <button class="hamburger" onclick="toggleSidebar()"><div></div><div></div><div></div></button>
      <h1>Payment Collection Log</h1>
    </div>
    <div class="topbar-date" id="topDate"></div>
  </div>

  <div class="content">
    <div id="alertBox" class="alert"></div>

    <!-- ── Filters ── -->
    <div class="filters-wrap">

      <!-- View mode -->
      <div class="filter-row">
        <span class="filter-lbl">View</span>
        <div class="filter-controls">
          <button class="pay-pill active"    data-view="log"     onclick="setView(this)">Full Log</button>
          <button class="pay-pill warn-pill" data-view="pending" onclick="setView(this)">⚠️ Pending Cash</button>
        </div>
      </div>

      <div class="filter-divider"></div>

      <!-- Date range -->
      <div class="filter-row">
        <span class="filter-lbl">Date Range</span>
        <div class="filter-controls">
          <div class="date-inputs">
            <input type="date" id="dateFrom" class="form-control" style="font-size:0.82rem;padding:6px 10px">
            <span class="date-arrow">→</span>
            <input type="date" id="dateTo"   class="form-control" style="font-size:0.82rem;padding:6px 10px">
          </div>
          <button id="loadBtn" class="btn btn-gold btn-sm" onclick="applyFilters()">Load</button>
        </div>
      </div>

      <div class="filter-divider"></div>

      <!-- Department (hidden in pending mode) -->
      <div class="filter-row" id="rowDept">
        <span class="filter-lbl">Department</span>
        <div class="filter-controls">
          <select id="deptFilter" class="form-control" style="font-size:0.82rem;padding:6px 10px" onchange="renderPayLog()">
            <option value="all">All Departments</option>
            <option value="games">🎮 Games &amp; Pool</option>
            <option value="bar">🍺 Bar &amp; Drinks</option>
            <option value="lounge">🛋️ Restaurant &amp; Lounge</option>
            <option value="food">🍽️ Food &amp; Kitchen</option>
            <option value="barbing">💈 Barbing Salon</option>
            <option value="apartments">🏠 Apartments</option>
            <option value="events">🎪 Events</option>
          </select>
        </div>
      </div>

      <div class="filter-divider" id="divDept"></div>

      <!-- Payment method (hidden in pending mode) -->
      <div class="filter-row" id="rowMethod">
        <span class="filter-lbl">Payment</span>
        <div class="filter-controls">
          <button class="pay-pill active" data-method="all"      onclick="setPayFilter(this)">All</button>
          <button class="pay-pill"         data-method="cash"     onclick="setPayFilter(this)">💵 Cash</button>
          <button class="pay-pill"         data-method="pos"      onclick="setPayFilter(this)">🖥 POS</button>
          <button class="pay-pill"         data-method="transfer" onclick="setPayFilter(this)">📲 Transfer</button>
        </div>
      </div>
    </div>

    <!-- ── Stats ── -->
    <div class="plog-stats" id="payLogTotals"></div>

    <!-- ── Content ── -->
    <div id="payLogContent">
      <div class="card">
        <div id="payLogList">
          <div style="color:var(--muted);padding:20px 0;text-align:center">Loading…</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="/portal/firebase-init.js"></script>
<script>
const currentStaff = getStaff();
requireAccess(currentStaff, 'payment-log');
populateSidebar(currentStaff);
buildNav(currentStaff, 'payment-log');
document.getElementById('topDate').textContent =
  new Date().toLocaleDateString('en-NG', {weekday:'long', year:'numeric', month:'long', day:'numeric'});

function N(n)   { return fmtNaira(n || 0); }
function esc(s) { return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

const _raw    = (currentStaff?.accessLevel || currentStaff?.role || '').toLowerCase().replace(/\s+/g,'');
const canMark = _raw === 'ceo' || _raw === 'superadmin' || _raw.includes('manager');

let _allData   = [];   /* { _id, ...firestoreFields } */
let _payFilter = 'all';
let _viewMode  = 'log'; /* 'log' | 'pending' */

/* ── Department normaliser ── */
function deptKey(r) {
  const d = (r.department || r.section || '').toLowerCase();
  if (d.includes('game') || d.includes('pool'))                       return 'games';
  if ((d.includes('bar') || d.includes('drink')) && !d.includes('barb')) return 'bar';
  if (d.includes('barb') || d.includes('salon'))                      return 'barbing';
  if (d.includes('lounge') || d.includes('restaurant'))               return 'lounge';
  if (d.includes('food') || d.includes('kitchen'))                    return 'food';
  if (d.includes('apart') || d.includes('apt'))                       return 'apartments';
  if (d.includes('event'))                                             return 'events';
  return 'other';
}

/* ── View mode toggle ── */
function setView(btn) {
  document.querySelectorAll('[data-view]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  _viewMode = btn.dataset.view;

  const isPending = _viewMode === 'pending';
  document.getElementById('rowDept').classList.toggle('dimmed', isPending);
  document.getElementById('divDept').classList.toggle('dimmed', isPending);
  document.getElementById('rowMethod').classList.toggle('dimmed', isPending);

  renderPayLog();
}

/* ── Payment method filter ── */
function setPayFilter(btn) {
  document.querySelectorAll('[data-method]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  _payFilter = btn.dataset.method;
  renderPayLog();
}

/* ── Render ── */
function renderPayLog() {
  _viewMode === 'pending' ? renderPending() : renderLog();
}

/* ── Full log render ── */
function renderLog() {
  const listEl = document.getElementById('payLogList');
  const totEl  = document.getElementById('payLogTotals');
  const dept   = document.getElementById('deptFilter').value;

  document.getElementById('payLogContent').innerHTML =
    '<div class="card"><div id="payLogList"></div></div>';
  const newList = document.getElementById('payLogList');

  const visible = _allData.filter(r => {
    const deptOk   = dept === 'all' || deptKey(r) === dept;
    const methodOk = _payFilter === 'all' || (r.paymentMethod || '').toLowerCase() === _payFilter;
    return deptOk && methodOk;
  });

  let grand = 0, cash = 0, pos = 0, trans = 0;
  visible.forEach(r => {
    const a = r.totalSales || 0;
    grand += a;
    const m = (r.paymentMethod || '').toLowerCase();
    if (m === 'cash')     cash  += a;
    else if (m === 'pos') pos   += a;
    else                  trans += a;
  });

  totEl.innerHTML =
    `<div class="plog-stat gold-stat"><div class="lbl">Total (${visible.length})</div><div class="val">${N(grand)}</div></div>` +
    (cash  > 0 ? `<div class="plog-stat"><div class="lbl">💵 Cash</div><div class="val" style="color:#065f46">${N(cash)}</div></div>` : '') +
    (pos   > 0 ? `<div class="plog-stat"><div class="lbl">🖥 POS</div><div class="val" style="color:#1e40af">${N(pos)}</div></div>` : '') +
    (trans > 0 ? `<div class="plog-stat"><div class="lbl">📲 Transfer</div><div class="val" style="color:#5b21b6">${N(trans)}</div></div>` : '');

  if (!visible.length) {
    newList.innerHTML = '<div style="color:var(--muted);padding:24px 0;text-align:center">No records match this filter.</div>';
    return;
  }

  const sorted = [...visible].sort((a, b) => {
    if (a.date !== b.date) return (b.date || '') > (a.date || '') ? 1 : -1;
    return (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0);
  });

  newList.innerHTML = sorted.map(r => {
    const method = (r.paymentMethod || '').toLowerCase();
    const badge  = method === 'cash'
      ? '<span class="bdg-cash">💵 Cash</span>'
      : method === 'pos'
        ? '<span class="bdg-pos">🖥 POS</span>'
        : '<span class="bdg-transfer">📲 Transfer</span>';

    let ts = null;
    const raw = r.createdAt;
    if (raw?.toDate)       ts = raw.toDate();
    else if (raw?.seconds) ts = new Date(raw.seconds * 1000);
    const time = ts ? ts.toLocaleTimeString('en-NG', {hour:'2-digit', minute:'2-digit'}) : '—';

    const collector     = r.collectedBy?.name || r.processedBy || r.staffName || '—';
    const collectorRole = r.collectedBy?.role || '';

    const isPending = method === 'cash' && r.cashRemittance === 'pending';
    const remTag    = method === 'cash' && r.cashRemittance
      ? (r.cashRemittance === 'confirmed'
          ? '<span class="rem-done">✓ Remitted</span>'
          : '<span class="rem-pending">Pending</span>')
      : '';

    const dept2 = r.department || r.section || '';
    const custParts = [
      r.customerName ? '👤 ' + esc(r.customerName) : '',
      r.tableLabel   ? esc(r.tableLabel)            : '',
      dept2          ? esc(dept2)                   : '',
    ].filter(Boolean);

    const markBtn = isPending && canMark
      ? `<div class="plog-row-actions"><button class="btn-mark-inline" onclick="markOne('${esc(r._id)}', this)">Mark Remitted</button></div>`
      : '';

    return `<div class="plog-row" data-id="${esc(r._id)}">
      <div class="plog-top">
        <div class="plog-badges">
          ${badge}
          <span style="font-size:0.72rem;color:var(--muted)">${time}</span>
          ${remTag}
        </div>
        <span class="plog-amt">${N(r.totalSales || 0)}</span>
      </div>
      ${custParts.length ? `<div class="plog-meta">${custParts.join(' · ')}</div>` : ''}
      <div class="plog-collector">Collected by: <strong style="font-weight:400;color:var(--text)">${esc(collector)}${collectorRole ? ' · ' + esc(collectorRole) : ''}</strong></div>
      ${r.date ? `<div class="plog-date-tag">${r.date}</div>` : ''}
      ${markBtn}
    </div>`;
  }).join('');
}

/* ── Pending cash grouped render ── */
function renderPending() {
  const totEl   = document.getElementById('payLogTotals');
  const content = document.getElementById('payLogContent');

  const pending = _allData.filter(r =>
    r.cashRemittance === 'pending' && (r.paymentMethod || '').toLowerCase() === 'cash'
  );

  if (!pending.length) {
    totEl.innerHTML = '';
    content.innerHTML = '<div class="card"><div style="color:var(--muted);padding:40px 0;text-align:center"><div style="font-size:2rem;margin-bottom:10px;opacity:0.5">✅</div>No pending cash remittances in this date range.</div></div>';
    return;
  }

  /* Group by collector */
  const groups = {};
  pending.forEach(r => {
    const key = r.collectedBy?.id || r.collectedBy?.name || 'unknown';
    if (!groups[key]) groups[key] = { info: r.collectedBy || {}, records: [] };
    groups[key].records.push(r);
  });

  const groupList = Object.values(groups).sort((a, b) =>
    b.records.reduce((s, r) => s + (r.totalSales || 0), 0) -
    a.records.reduce((s, r) => s + (r.totalSales || 0), 0)
  );

  const grandTotal = pending.reduce((s, r) => s + (r.totalSales || 0), 0);

  totEl.innerHTML =
    `<div class="plog-stat warn-stat"><div class="lbl">Total Pending</div><div class="val">${N(grandTotal)}</div></div>` +
    `<div class="plog-stat"><div class="lbl">Transactions</div><div class="val">${pending.length}</div></div>` +
    `<div class="plog-stat"><div class="lbl">Collectors Owing</div><div class="val">${groupList.length}</div></div>`;

  content.innerHTML = groupList.map(g => {
    const name    = g.info.name || 'Unknown';
    const role    = g.info.role || '';
    const total   = g.records.reduce((s, r) => s + (r.totalSales || 0), 0);
    const ids     = g.records.map(r => r._id).join(',');
    const initial = name.charAt(0).toUpperCase();

    const rows = [...g.records]
      .sort((a, b) => {
        if (a.date !== b.date) return (b.date || '') > (a.date || '') ? 1 : -1;
        return (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0);
      })
      .map(r => {
        let ts = null;
        if (r.createdAt?.toDate)       ts = r.createdAt.toDate();
        else if (r.createdAt?.seconds) ts = new Date(r.createdAt.seconds * 1000);
        const time = ts ? ts.toLocaleTimeString('en-NG', {hour:'2-digit', minute:'2-digit'}) : '—';
        const dept = r.department || r.section || '';
        const sub  = [dept ? esc(dept) : '', r.customerName ? '👤 ' + esc(r.customerName) : ''].filter(Boolean).join(' · ');
        return `<div class="tx-row" data-id="${esc(r._id)}">
          <div class="tx-left">
            <div class="tx-meta">${esc(r.date)} · ${time}</div>
            ${sub ? `<div class="tx-sub">${sub}</div>` : ''}
          </div>
          <div class="tx-right">
            <span class="tx-amt">${N(r.totalSales || 0)}</span>
            ${canMark ? `<button class="btn-mark-one" onclick="markOne('${esc(r._id)}', this)">Mark Remitted</button>` : ''}
          </div>
        </div>`;
      }).join('');

    return `<div class="coll-card">
      <div class="coll-header">
        <div class="coll-name-wrap">
          <div class="coll-avatar">${initial}</div>
          <div>
            <div class="coll-name">${esc(name)}</div>
            ${role ? `<div class="coll-role">${esc(role)}</div>` : ''}
          </div>
        </div>
        <div class="coll-right">
          <div>
            <div class="coll-total-amt">${N(total)}</div>
            <div class="coll-total-cnt">${g.records.length} collection${g.records.length !== 1 ? 's' : ''}</div>
          </div>
          ${canMark ? `<button class="btn-mark-all" onclick="markAll('${esc(ids)}', '${esc(name)}')">Mark All Remitted</button>` : ''}
        </div>
      </div>
      <div class="tx-list">${rows}</div>
    </div>`;
  }).join('');
}

/* ── Mark one transaction remitted ── */
async function markOne(docId, btn) {
  if (btn) btn.disabled = true;
  try {
    await db.collection('sales').doc(docId).update({
      cashRemittance: 'confirmed',
      remittedAt: firebase.firestore.FieldValue.serverTimestamp(),
      remittedBy: { id: currentStaff.id, name: currentStaff.name }
    });
    /* Update local data */
    const rec = _allData.find(r => r._id === docId);
    if (rec) { rec.cashRemittance = 'confirmed'; rec.remittedAt = new Date(); }
    renderPayLog();
    showAlert('alertBox', 'Marked as remitted.', 'alert-success');
  } catch(e) {
    if (btn) btn.disabled = false;
    showAlert('alertBox', 'Failed: ' + e.message, 'alert-error');
  }
}

/* ── Mark all for a collector remitted ── */
async function markAll(idsStr, collectorName) {
  const ids = idsStr.split(',').filter(Boolean);
  if (!ids.length) return;
  if (!confirm(`Mark all ${ids.length} collection${ids.length !== 1 ? 's' : ''} from ${collectorName} as remitted?`)) return;

  document.querySelectorAll('.btn-mark-all, .btn-mark-one').forEach(b => b.disabled = true);

  const now   = firebase.firestore.FieldValue.serverTimestamp();
  const batch = db.batch();
  ids.forEach(id => batch.update(db.collection('sales').doc(id), {
    cashRemittance: 'confirmed',
    remittedAt: now,
    remittedBy: { id: currentStaff.id, name: currentStaff.name }
  }));

  try {
    await batch.commit();
    ids.forEach(id => {
      const rec = _allData.find(r => r._id === id);
      if (rec) { rec.cashRemittance = 'confirmed'; rec.remittedAt = new Date(); }
    });
    renderPayLog();
    showAlert('alertBox', `${ids.length} collection${ids.length !== 1 ? 's' : ''} marked as remitted.`, 'alert-success');
  } catch(e) {
    document.querySelectorAll('.btn-mark-all, .btn-mark-one').forEach(b => b.disabled = false);
    showAlert('alertBox', 'Failed: ' + e.message, 'alert-error');
  }
}

/* ── Load from Firestore ── */
async function applyFilters() {
  const from = document.getElementById('dateFrom').value;
  const to   = document.getElementById('dateTo').value;
  if (!from || !to) { showAlert('alertBox', 'Please select both a From and To date.', 'alert-error'); return; }
  if (from > to)    { showAlert('alertBox', 'From date must be on or before To date.', 'alert-error'); return; }

  document.getElementById('payLogTotals').innerHTML = '';
  document.getElementById('payLogContent').innerHTML =
    '<div class="card"><div id="payLogList"><div style="color:var(--muted);padding:24px 0;text-align:center">Loading…</div></div></div>';

  try {
    const snap = await db.collection('sales')
      .where('date', '>=', from)
      .where('date', '<=', to)
      .get();
    _allData = snap.docs.map(d => ({ _id: d.id, ...d.data() }));
    renderPayLog();
  } catch(e) {
    document.getElementById('payLogContent').innerHTML =
      `<div class="card"><div style="color:#ef4444;padding:16px 0;text-align:center">Failed to load: ${esc(e.message)}</div></div>`;
  }
}

/* ── Init ── */
const today = todayStr();
document.getElementById('dateFrom').value = today;
document.getElementById('dateTo').value   = today;
applyFilters();
</script>
